<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3f0"><meta name="description" content="如果你是游戏里的经典角色原型"><title>如果你是游戏里的经典角色原型</title><style>
:root{--bg:#f7f3f0;--paper:#fffdfa;--ink:#332f33;--muted:#827981;--accent:#987d91;--accent2:#e9dce5;--line:#ece5e9;--soft:#f4edf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;padding:20px 14px 34px}button{font:inherit;cursor:pointer}.app{max-width:520px;margin:0 auto}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.08em;margin:4px 2px 20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:0 8px 28px #65515a0a}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}.hero{padding:8px 2px 18px}.hero h1{font-size:32px;line-height:1.3;letter-spacing:-.04em;margin:12px 0 14px;font-weight:750}.hero p{color:var(--muted);margin:0;font-size:15px}.deco{height:5px;width:58px;border-radius:9px;background:var(--accent2);margin:20px 0}.note{font-size:12px;color:var(--muted);margin-top:14px}.primary{width:100%;border:0;border-radius:15px;background:var(--accent);color:white;padding:14px 18px;font-weight:650;margin-top:22px}.secondary{border:1px solid var(--line);background:transparent;border-radius:13px;padding:10px 14px;color:var(--ink)}.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.progress{height:4px;background:#eee7ec;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar{height:100%;background:var(--accent);width:10%;transition:width .2s}.qtitle{font-size:22px;line-height:1.45;margin:0 0 22px;letter-spacing:-.025em}.options{display:grid;gap:10px}.option{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fffdfa;color:var(--ink);line-height:1.5;min-height:58px}.letter{width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:#f3edf2;color:#897488;display:grid;place-items:center;font-size:12px}.option:active,.option.selected{border-color:var(--accent);background:var(--soft)}.nav{display:flex;gap:10px;margin-top:20px;align-items:center}.tiny{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}.result-kicker{font-size:12px;color:var(--accent);letter-spacing:.12em;font-weight:700}.result h1{font-size:31px;line-height:1.28;letter-spacing:-.04em;margin:8px 0}.subtitle{font-size:17px;line-height:1.5;color:#665765;margin:0 0 22px}.result p{margin:0 0 16px}.section{border-top:1px solid var(--line);padding-top:17px;margin-top:19px}.section h2{font-size:15px;margin:0 0 8px}.quote{background:var(--soft);padding:16px;border-radius:16px;font-weight:650;line-height:1.6;margin-top:20px}.tag{display:inline-block;font-size:12px;background:#f3edf2;color:#7b647a;padding:5px 10px;border-radius:99px;margin:2px 5px 8px 0}.result-actions{display:grid;gap:10px;margin-top:22px}.result-actions .primary{margin:0}.hidden{display:none!important}@media(min-width:500px){body{padding-top:34px}.panel{padding:30px 28px}.hero h1,.result h1{font-size:36px}}</style></head><body><main class="app"><div class="topline"><span>JUST FOR FUN</span><span>轻松了解自己</span></div>
<section id="home" class="panel"><div class="hero"><div class="eyebrow">PLAYER ARCHETYPE</div><h1>如果你是游戏里的经典角色原型</h1><p>有人专注收集，有人追求操作，有人只想探索地图或和朋友整活。看看你玩游戏时最像哪种角色。</p><div class="deco"></div><p>没有标准答案，按平时的自然反应选就好。</p></div><button class="primary" id="start">开始看看 →</button><div class="note">约 2 分钟 · 10 道单选题 · 没有标准答案</div></section>
<section id="quiz" class="panel hidden"><div class="progressrow"><span id="step">QUESTION 01</span><span id="count">1 / 10</span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question" class="qtitle"></h2><div id="options" class="options"></div><div class="nav"><button class="secondary" id="prev">← 上一题</button><span class="tiny" style="flex:1;text-align:right;margin:auto 0">点选答案，自动进入下一题</span></div><div class="tiny">选最接近你平时反应的答案，不用选“看起来最好”的。</div></section>
<section id="result" class="panel result hidden"><div class="result-kicker">YOUR RESULT</div><div id="rtype" class="tag"></div><h1 id="rtitle"></h1><p id="rsubtitle" class="subtitle"></p><div id="rbody"></div><div class="quote" id="quote"></div><div class="section"><h2>给你的小提示</h2><p id="tip"></p></div><div class="result-actions"><button class="primary" id="again">再看一次</button><button class="secondary" id="copy">复制我的结果</button></div><div class="tiny">这是趣味画像，不定义你的全部。</div></section></main>
<script>const DATA={"title":"如果你是游戏里的经典角色原型","subtitle":"有人专注收集，有人追求操作，有人只想探索地图或和朋友整活。看看你玩游戏时最像哪种角色。","eyebrow":"PLAYER ARCHETYPE","types":{"collector":{"name":"收藏家","sub":"你不只想通关，还想把这段经历完整留下。","desc":"你会留意地图角落、隐藏道具、图鉴进度和那些容易被忽略的小内容。别人打完主线就准备开下一款，你可能还在回头补最后几个收集项。对你来说，游戏的乐趣不只在终点，也在探索过程中一点点填满空白。","moment":"主线通关之后，打开攻略看还有哪些支线、彩蛋或没拿到的收藏品。","blind":"完成度有时会变成负担。没收集到每一项，不代表这趟体验就不完整。","quote":"别人记得结局，你记得一路上发现过的每一个小惊喜。","tip":"给自己留一点自由探索的空间，也允许有些东西下次再补。"},"killer":{"name":"杀手","sub":"你喜欢明确目标，也享受把操作打漂亮的瞬间。","desc":"你进入游戏后很容易锁定目标：赢下这局、打出更好的成绩、把难关拿下。你不一定只在意排名，但会享受自己越来越熟练、决策越来越果断的过程。失败通常不会让你马上放弃，反而会想知道下一次能不能做得更好。","moment":"输掉一局后先复盘关键失误，而不是立刻怪队友或运气。","blind":"目标感太强时，容易把放松时间也变成考核。偶尔乱玩一局，也不算浪费。","quote":"你喜欢的不只是赢，而是知道自己为什么赢。","tip":"想认真冲分就认真冲，想休息时也允许自己不追求表现。"},"bard":{"name":"吟游诗人","sub":"你玩游戏不只为了结果，还为了那些值得讲给别人听的故事。","desc":"你会被角色、剧情、配乐和世界观打动，也喜欢记住某句台词、某个选择或一段意外的旅程。即使游戏机制不是最强项，只要故事足够吸引你，你就愿意继续走下去。对你来说，体验本身就是收获。","moment":"通关之后还会找角色分析、剧情讨论，或者把某个片段反复回味。","blind":"太容易沉浸在故事里，有时会被剧透或不理想的结局影响很久。","quote":"有些游戏结束了，但你心里的那段旅程还没结束。","tip":"放心喜欢自己在意的角色和故事，不必证明它们在玩法上有多“硬核”。"},"explorer":{"name":"探索者","sub":"地图上写着未知，你就很难忍住不去看看。","desc":"你喜欢试路、看风景、测试边界，也愿意为了一个没见过的地点偏离主线。你不一定需要明确奖励，发现新区域、奇怪机制或开发者藏起来的小细节，本身就很有成就感。","moment":"队友已经往任务点走了，你却绕去看地图边缘那条没走过的小路。","blind":"好奇心有时会让你忘了原本想做什么，任务日志越积越多。","quote":"你不是迷路，只是在确认这张地图还有多少种走法。","tip":"探索时不用赶进度，但可以偶尔标记一下真正想完成的目标。"},"strategist":{"name":"战术家","sub":"你喜欢看懂规则，再找到最聪明的解法。","desc":"你会关注资源、技能搭配、队伍配置和行动顺序。遇到难关时，你倾向于先理解机制，再尝试调整策略，而不是一味硬拼。你享受的，是把一团复杂的问题理顺之后，发现局面突然变得清晰。","moment":"卡关时你先研究敌人的机制或阵容配置，找到关键点后才重新开局。","blind":"研究方案可能比实际开打还久。很多时候，试一次比继续看十篇攻略更快。","quote":"别人看到的是难关，你看到的是一组还没解开的条件。","tip":"分析到够用就开始行动，让实战反馈帮你完善思路。"},"guardian":{"name":"守护者","sub":"你会在意队伍能不能一起走到终点。","desc":"组队时你常常会注意队友状态、团队节奏和大家是否跟得上。你不一定每次都拿最高输出，但会在关键时刻补位、救场或提醒风险。对你来说，团队打得顺、朋友玩得开心，也是一种很实在的胜利。","moment":"队友失误时先想怎么补救，而不是急着责怪；打完也愿意帮新人解释机制。","blind":"你可能默默承担太多，最后自己反而没玩得尽兴。团队合作不等于一个人负责所有人。","quote":"你不一定站在最前面，但常常是让大家能继续往前走的人。","tip":"照顾团队时也记得说出自己的需求，别把每次救场都当成义务。"},"trickster":{"name":"整活玩家","sub":"你最擅长的，是把“正常玩法”变成另一种玩法。","desc":"你不太满足于按说明书走流程。奇怪的配装、出乎意料的路线、好友间的恶作剧或一场没有胜负压力的混乱局，都可能比标准答案更让你开心。你喜欢游戏里可以自由发挥的部分，也愿意为一个好笑的瞬间牺牲一点效率。","moment":"大家在认真推进任务，你突然提出一个听起来不太靠谱、但想想又很有趣的玩法。","blind":"玩得太随性时，可能会影响只想认真完成目标的队友。开整之前先确认大家都愿意。","quote":"攻略告诉你怎么通关，而你想知道还能怎么把这局玩出花。","tip":"继续保留创造力，也记得给队友选择认真玩的空间。"},"social":{"name":"社交家","sub":"游戏最好的掉落，有时是一起玩的人。","desc":"你会因为朋友上线而打开游戏，也很容易把一次组队变成固定的日常。你可能记得队友的习惯、大家一起经历过的翻车现场，也会主动拉人回来玩。单机内容你也能享受，但和人一起分享时，乐趣常常会放大。","moment":"本来只打算上线十分钟，结果朋友一来，大家又聊又玩到很晚。","blind":"如果朋友不在线，你可能会觉得游戏突然少了点意思。也可以培养一些只属于自己的玩法。","quote":"你收藏的不只是游戏内容，还有一起经历过这些内容的人。","tip":"珍惜一起玩的关系，也试着找到即使独自上线也能享受的部分。"}},"qs":[["进入一款新游戏，你最想先做什么？",[["把地图打开，看看还有哪些地方没去","explorer"],["研究职业、技能和装备怎么搭最合适","strategist"],["跟着主线走，看看故事到底讲什么","bard"],["先看看有哪些图鉴、收集和隐藏内容","collector"]]],["打一个反复过不去的关卡，你通常会？",[["复盘操作，练到能稳定打过","killer"],["研究机制和配置，换种策略试试","strategist"],["拉朋友一起打，大家配合着过","guardian"],["先去别处逛逛，说不定发现新道具或路线","explorer"]]],["你最容易因为哪种瞬间记住一款游戏？",[["发现一个藏得很深的秘密区域","explorer"],["一段角色剧情或一句台词","bard"],["打出一次特别漂亮的操作","killer"],["和朋友一起笑到停不下来","social"]]],["如果游戏有一堆支线任务，你会？",[["很想把任务和收藏尽量补全","collector"],["挑有意思的做，不想被清单绑架","trickster"],["优先做能提升队伍或角色强度的任务","strategist"],["看剧情有没有我在意的角色","bard"]]],["组队时你更常扮演什么角色？",[["盯住关键目标，尽量打出好成绩","killer"],["补位、支援，保证队伍能继续打","guardian"],["负责喊人、聊天、把大家凑齐","social"],["提出一些奇怪但可能很有趣的打法","trickster"]]],["拿到新装备或新角色时，你第一反应是？",[["研究数值和搭配，看看能不能变强","strategist"],["先试试手感，能不能打出漂亮操作","killer"],["看看角色背景、语音和故事","bard"],["放进收藏或图鉴，看看还有什么没解锁","collector"]]],["你最喜欢的游戏自由度来自哪里？",[["能去很多没标记的地方探索","explorer"],["能自己研究玩法和最优解","strategist"],["能尝试离谱玩法，不必总走正道","trickster"],["能和朋友一起做各种事","social"]]],["队友刚入坑，操作还不熟，你会？",[["耐心讲机制，帮他熟悉规则","guardian"],["带着他先体验好玩的部分","social"],["给他一套容易上手的配置建议","strategist"],["讲讲剧情和角色，帮他找到喜欢的点","bard"]]],["通关之后，你最可能继续做什么？",[["补齐隐藏任务、图鉴和遗漏收集","collector"],["挑战更高难度，刷新自己的成绩","killer"],["看看别人对结局和角色的解读","bard"],["试试完全不同的路线或玩法","trickster"]]],["哪种游戏时刻最让你满足？",[["终于靠自己的判断打出完美一局","killer"],["整个队伍配合起来，谁都没被落下","guardian"],["无意间发现一个没人告诉你的秘密","explorer"],["和朋友把普通的一晚玩成了难忘回忆","social"]]]],"kind":"game"};let idx=0,answers=Array(DATA.qs.length).fill(null),advancing=false;const $=id=>document.getElementById(id);function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function renderQ(){const q=DATA.qs[idx];$("step").textContent="QUESTION "+String(idx+1).padStart(2,"0");$("count").textContent=(idx+1)+" / "+DATA.qs.length;$("bar").style.width=((idx+1)/DATA.qs.length*100)+"%";$("question").textContent=q[0];$("options").innerHTML="";q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="option";b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span></span>';b.querySelector("span:last-child").textContent=o[0];b.onclick=()=>{if(advancing)return;answers[idx]=i;b.classList.add("selected");advancing=true;setTimeout(()=>{advancing=false;if(idx<DATA.qs.length-1){idx++;renderQ()}else finish()},180)};$("options").appendChild(b)});$("prev").style.visibility=idx===0?"hidden":"visible"}function finish(){const scores={};Object.keys(DATA.types).forEach(k=>scores[k]=0);answers.forEach((a,i)=>{if(a!==null)scores[DATA.qs[i][1][a][1]]++});const max=Math.max(...Object.values(scores));const tied=Object.keys(scores).filter(k=>scores[k]===max);let winner=tied[0];for(let i=answers.length-1;i>=0;i--){const key=DATA.qs[i][1][answers[i]][1];if(tied.includes(key)){winner=key;break}}const t=DATA.types[winner];$("rtype").textContent="你的类型";$("rtitle").textContent=t.name;$("rsubtitle").textContent=t.sub;$("rbody").innerHTML='<p>'+t.desc+'</p><div class="section"><h2>你最有代表性的瞬间</h2><p>'+t.moment+'</p></div><div class="section"><h2>你可能没注意到的另一面</h2><p>'+t.blind+'</p></div>';$("quote").textContent=t.quote;$("tip").textContent=t.tip;show("result")}function reset(){idx=0;advancing=false;answers=Array(DATA.qs.length).fill(null)}$("start").onclick=()=>{reset();show("quiz");renderQ()};$("prev").onclick=()=>{if(idx>0&&!advancing){idx--;renderQ()}};$("again").onclick=()=>{reset();show("home")};$("copy").onclick=async()=>{const t=DATA.types[Object.keys(DATA.types).find(k=>DATA.types[k].name===$("rtitle").textContent)];const text=DATA.title+"\n我的结果："+t.name+"\n"+t.sub+"\n"+t.quote;try{await navigator.clipboard.writeText(text);$("copy").textContent="已复制 ✓"}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("copy").textContent="已复制 ✓"}};if(new URLSearchParams(location.search).get("preview")==="result"){const t=DATA.types[Object.keys(DATA.types)[0]];$("rtype").textContent="示例结果";$("rtitle").textContent=t.name;$("rsubtitle").textContent=t.sub;$("rbody").innerHTML='<p>'+t.desc+'</p><div class="section"><h2>你最有代表性的瞬间</h2><p>'+t.moment+'</p></div><div class="section"><h2>你可能没注意到的另一面</h2><p>'+t.blind+'</p></div>';$("quote").textContent=t.quote;$("tip").textContent=t.tip;show("result")}</script></body></html>
