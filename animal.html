"黑猫":[["你的动物本能","黑猫式的你很重视“我愿不愿意”。你不喜欢被强行推进关系，也不太吃夸张热情那一套；真正让你放下戒心的，通常是对方长期稳定的表现。你会先确认安全，再决定展示多少自己。"],["你适合的环境","你需要能自主安排节奏的空间：可以独处，也可以随时加入喜欢的人；可以认真投入，也能不被随意打断。过度被监督、被催促或被要求时刻回应的环境，很容易消耗你的耐心。"],["你的相处说明书","想靠近你，最有效的不是追问“你怎么了”，而是给你一点缓冲，再真诚地表达关心。尊重你的拒绝，也记得在你主动靠近时回应。你需要的是稳定的在意，而不是侵入式的热情。"],["当你状态不佳时","你可能会减少表达、独自整理思绪，甚至暂时消失一会儿。可以保留独处，但试着给重要的人一个简单信号：你只是需要时间，并不是要结束关系。"]],
"狐狸":[["你的动物本能","狐狸式的你会先寻找可能性。遇到变化，你通常很快开始扫描信息、调整策略，擅长把限制变成新的玩法。你享受的不只是结果，也包括发现新路径的过程。"],["你适合的环境","有探索空间、反馈及时、允许尝试的环境更容易激发你。过度重复、凡事只能照旧、没有选择余地的安排会让你很快失去动力；但完全没有目标的自由，也可能让你分散精力。"],["你的相处说明书","和你相处，最好既能聊新鲜事，也能认真讨论问题。你欣赏有自己想法的人，不太喜欢用控制来换取安全感。你也可以练习直接表达真实意图，不必每次都用玩笑或迂回试探。"],["当你状态不佳时","你可能开始不停找新方案，或者把严肃的事说得轻松，借此避开压力。试着把选择缩小到两三个，再决定一个可以马上做的小动作；不必等到所有可能性都看清。"]],
"雪豹":[["你的动物本能","雪豹式的你不急着把能量用在外显的竞争上。你会默默评估目标、积累能力，在真正重要的时刻集中发力。你在意的是自己有没有变得更扎实，而不是每一步都被别人看见。"],["你适合的环境","你适合目标清晰、能深度投入、成果有实际意义的环境。频繁打断、过度比较和只看表面声量的氛围，会让你觉得精力被浪费。你需要挑战，但也需要合理恢复。"],["你的相处说明书","请不要只用你做了多少事来代替表达。你可能觉得“我已经行动了，对方应该懂”，但别人未必读得懂你的方式。把关心和需求说得再明白一点，会让你的可靠更容易被接收到。"],["当你状态不佳时","你可能会继续硬撑，把休息推迟到事情全部完成之后。试着把恢复精力也纳入计划，给任务设置足够好的完成标准，而不是每次都追求极限表现。"]],
"白狼":[["你的动物本能","白狼式的你会本能地确认队伍是否可靠、彼此是否守约。你重视共同目标，也愿意在关键时刻承担责任。对你来说，真正的亲近不是口头上的热络，而是遇事时彼此站得住。"],["你适合的环境","有明确分工、彼此信任、可以协作完成目标的环境更适合你。你能接受困难，但很难长期忍受推卸责任、反复失信或把团队付出当作理所当然的氛围。"],["你的相处说明书","你常用行动表达在乎，也希望对方用行动回应。可以把期待讲清楚，而不是默默承担后等别人自己发现；可靠的关系应该允许你说累、说不，也允许别人用自己的方式关心你。"],["当你状态不佳时","你可能把所有人的问题都当成自己的责任。先分清哪些是你能负责的、哪些需要共同承担，再决定是否伸手。保护同伴很重要，但你不是整个队伍唯一的支柱。"]],
"鹿":[["你的动物本能","鹿式的你会先感知环境是否安全，再决定要不要靠近。你能捕捉到语气、氛围和细节变化，因此很会体察人心；但感受到别人的情绪，并不代表你必须替对方解决它。"],["你适合的环境","清晰、友善、沟通有回应的环境更能让你发挥。长期处在忽冷忽热、冲突频繁或需要不断揣摩他人心思的关系里，你会比自己意识到的更疲惫。"],["你的相处说明书","你很会照顾别人的感受，也值得被同样认真地照顾。可以试着直接说出“我希望你怎么做”，而不是只暗示或等待对方察觉。清楚表达不是破坏气氛，而是减少误会。"],["当你状态不佳时","你可能反复回想一句话、一个眼神，试图找出是不是自己做错了什么。先区分事实和猜测；如果事情重要，就温和地问清楚，不必独自在脑内完成整场对话。"]],
"兔子":[["你的动物本能","兔子式的你会先确认周围是否安全，再决定跑多快。谨慎是你保护精力的方式，不是能力不足。只要有一点熟悉感和掌控感，你往往比别人想象中更愿意尝试。"],["你适合的环境","有稳定预期、可以循序渐进、允许适应期的环境更适合你。突然被推到聚光灯下，或被要求立刻做出反应，可能让你暂时发挥失常；给自己一点热身时间，你会更自在。"],["你的相处说明书","稳定回应和明确态度会让你更有安全感。你可以慢慢打开自己，不必为了证明大方就强迫自己接受所有邀约；同时也可以尝试把拒绝说清楚，而不是因为怕让人失望而勉强答应。"],["当你状态不佳时","你可能因为担心失败而迟迟不开始，或者先预演很多糟糕情况。把目标缩小到一次尝试，不要求自己马上表现完美。你需要的可能不是百分之百确定，而是一个足够安全的起点。"]],
"大熊猫":[["你的动物本能","大熊猫式的你会优先寻找可持续的舒服状态。你知道精力有限，不想把每件事都变成竞赛；当你认定一件事值得投入，也能稳稳地做下去，只是不愿为了外界的眼光无止境透支。"],["你适合的环境","尊重个人节奏、结果明确、能兼顾生活的环境会让你发挥得更好。你不怕认真，但不喜欢把忙碌本身当作价值证明。对你来说，工作和生活都应该有让人真正感受到的收获。"],["你的相处说明书","和你相处，不必时刻制造惊喜，踏实的小事就很有分量。你通常喜欢自然、不费劲的关系；但如果你总用“没关系”来跳过不舒服的部分，问题也可能慢慢积累。松弛不等于什么都不说。"],["当你状态不佳时","你可能选择先放一放，期待压力自己消退。休息当然重要，但如果某件事一直悬着，不妨只做五分钟，把启动成本降下来。你不需要突然变得高强度，只要重新动起来就好。"]],
"猫头鹰":[["你的动物本能","猫头鹰式的你会先收集线索，再决定是否行动。你喜欢弄清楚事情为什么发生，也会注意到别人忽略的细节。你不一定需要掌控一切，但希望自己做决定时有足够的信息作为依据。"],["你适合的环境","你适合能够独立思考、允许提出问题、重视事实和专业判断的环境。信息混乱、目标反复变化又不给解释的情况，会让你很难安心投入；适度讨论也能帮助你避免独自推演过头。"],["你的相处说明书","你可能习惯先分析问题，再给出解决方案。但在亲密关系里，先听完、先回应情绪，有时比立刻找出原因更重要。你也可以告诉别人自己正在思考，而不是让沉默替你传递信息。"],["当你状态不佳时","你可能不断搜集信息，希望把风险降到最低，结果一直没有开始。给自己设一个决策截止点：信息达到“足够好”就先行动，再根据实际反馈调整。不是所有问题都能只靠思考解决。"]]
};
 // 每个选项都有明确的原型倾向；各题轮换映射，避免固定选某个字母就总得到同一种动物。
const qs=[
["走进一片陌生森林，你第一眼会注意什么？",["哪里安静、适合自己待一会儿","哪条小路看起来最有意思","周围有没有同伴或需要帮助的小动物","树枝、脚印和环境里藏着什么线索"]],
["如果突然听到身后有动静，你会？",["先停下来，保持距离观察","轻巧地换个方向，看看发生什么","确认身边的人都没被吓到","不急着动，先分辨声音来自哪里"]],
["你最想拥有哪种超能力？",["随时进入自己的隐秘空间","快速适应任何新环境","感知重要之人的情绪","看见事物背后隐藏的线索"]],
["选一个最舒服的窝，你会选？",["高处、隐蔽、没人打扰的小角落","能通向很多地方的灵活据点","温暖柔软、适合和伙伴待在一起的窝","视野开阔、方便观察四周的地方"]],
["野外探险时，你最像队伍里的谁？",["按自己的节奏探索，不盲目跟队","发现新路线，还能随机应变","留意大家状态，确保没人掉队","记住地形和细节，提前判断风险"]],
["面对一扇神秘的门，你会怎么做？",["先确认里面是否允许自己自在行动","找找有没有别的入口或有趣机关","想想一起进去的人是否都准备好了","仔细检查门上的符号和痕迹"]],
["哪种天气最像你的能量状态？",["夜色安静，适合独处和恢复","风吹云动，充满变化和可能","阳光温暖，适合靠近熟悉的人","雨后清晰，适合思考和观察"]],
["如果可以选择一种移动方式？",["悄无声息地穿过自己的路线","轻快敏捷，随时改变方向","和伙伴并肩前进，彼此照应","从高处看清全局，再决定路线"]],
["你会把什么当作自己的宝物？",["只属于自己的秘密收藏","旅行途中遇到的新奇小物","朋友送的纪念品或共同回忆","能解开谜题的地图或旧笔记"]],
["发现一处隐秘花园，你会？",["找个角落安静享受，不想被打扰","四处探索，看看还有什么惊喜","想带亲近的人一起来分享","先观察花草、路径和不寻常的细节"]],
["你更喜欢哪种游戏任务？",["潜行、独立行动、完成个人目标","探索地图、收集新发现、灵活通关","组队协作、保护队友、共同达成目标","解谜、追踪线索、提前布局"]],
["遇到一条陌生小路，你的直觉是？",["只要不影响自己的节奏，就慢慢走","走走看，说不定有惊喜","看看伙伴是否也愿意一起去","先观察路况，判断是否安全"]],
["如果动物朋友们要给你分工，你更适合？",["守着自己的领地，关键时刻再出现","当机动 scout，哪里都能去看看","照顾队伍，让大家保持安心","负责观察、记路和发现隐藏信息"]],
["哪种小习惯最像你？",["喜欢有自己的固定角落和仪式感","想到就尝试，不爱被一种方法限制","会记得别人喜欢什么、需要什么","常常注意到不起眼的小变化"]],
["选一句作为你的动物生存法则？",["保持自由，也守好自己的边界","灵活一点，世界处处有新路","珍惜同伴，温柔也有力量","先观察，再用自己的判断行动"]]
];
const map=[
[0,1,4,6],[2,1,5,7],[0,1,4,3],[2,1,5,6],[0,1,4,7],
[2,1,3,6],[0,1,4,7],[2,1,3,6],[0,1,5,7],[2,1,4,6],
[0,1,3,7],[2,1,4,6],[0,1,5,7],[2,1,3,6],[0,1,4,7]
];
let index=0,answers=[];
const app=document.getElementById("app");
function start(){index=0;answers=[];renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){
const q=qs[index];const percent=Math.round(index/qs.length*100);
app.innerHTML='<div class="topline"><span>动物塑探索</span><span>第 '+(index+1)+' / '+qs.length+' 题</span></div><div class="progress"><div class="bar" style="width:'+percent+'%"></div></div><h2>'+q[0]+'</h2><div>'+q[1].map((x,j)=>'<button class="option'+(answers[index]===j?' selected':'')+'" onclick="pick('+j+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+x+'</span></button>').join('')+'</div><div class="nav">'+(index?'<button class="secondary" onclick="back()">← 上一题</button>':'<button class="secondary" onclick="home()">返回介绍</button>')+'</div>';
}
function home(){app.innerHTML='<h1>你是什么动物塑？</h1><p>如果把你的性格比作一种动物，会是什么？从相处方式、直觉反应和生活节奏里，找到最像你的动物原型。</p><div><span class="pill">15 道选择题</span><span class="pill">约 3 分钟</span><span class="pill">凭直觉作答</span></div><button class="primary" onclick="start()">开始看看 →</button><p class="foot">没有标准答案，凭第一直觉选就好。</p>'}
function back(){if(index>0){index--;renderQuestion();}}
function pick(n){answers[index]=n;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(index<qs.length-1){index++;renderQuestion();}else finish();}
function finish(){
const scores=Array(types.length).fill(0);
answers.forEach((answer,qi)=>{scores[map[qi][answer]]+=1;});
// 轻微平局裁决：优先采用用户更早作答支持的原型，结果稳定可解释。
const max=Math.max(...scores);let winner=scores.indexOf(max);
if(scores.filter(v=>v===max).length>1){for(let k=0;k<answers.length;k++){const t=map[k][answers[k]];if(scores[t]===max){winner=t;break;}}}
const t=types[winner];const second=scores.map((v,i)=>({v,i})).filter(x=>x.i!==winner).sort((a,b)=>b.v-a.v)[0];
app.innerHTML='<div class="result"><div class="eyebrow">YOUR ANIMAL ARCHETYPE</div><div class="animal">'+t.emoji+'</div><p class="muted">你的动物塑是</p><h2>'+t.name+'</h2><p>'+t.share+'</p><div class="keywords">'+t.tags.map(x=>'<span class="keyword">'+x+'</span>').join('')+'</div></div><div class="result-copy"><strong>你的第一印象</strong><p>'+t.desc+'</p><p class="muted">你的第二倾向：'+types[second.i].name+'（'+types[second.i].emoji+'）</p></div>'+t.sections.concat(extraProfiles[t.name]).map(s=>'<div class="result-copy"><strong>'+s[0]+'</strong><p>'+s[1]+'</p></div>').join('')+'<div class="actions"><button class="primary" onclick="copyResult('+winner+')">复制我的结果</button><button onclick="start()">再玩一次 ↻</button></div><p class="foot">结果由全部 15 道答案累计得出。仅供娱乐与自我探索，不构成专业心理评估。</p>';
window.scrollTo({top:0,behavior:"smooth"});
}
function copyResult(winner){const t=types[winner];const text='我的动物塑是 '+t.emoji+t.name+'！'+t.share+'\n你是什么动物塑？';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert("结果文案已复制，可以去分享啦！")).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const el=document.createElement("textarea");el.value=text;document.body.appendChild(el);el.select();try{document.execCommand("copy");alert("结果文案已复制，可以去分享啦！");}catch(e){alert(text);}el.remove();}
</script></body></html>
