<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1ea">
<title>你是什么动物塑？｜趣味性格小测试</title>
<style>
:root{--ink:#292b2b;--muted:#77776f;--paper:#f5f1ea;--card:#fffdf9;--green:#647b69;--line:#e9e3d9;--soft:#eef1eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 14px}
main{max-width:620px;margin:0 auto}.card{background:var(--card);border:1px solid rgba(80,70,50,.06);border-radius:26px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 36px #3e35200a}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green);font-weight:700}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--muted);margin:4px 5px 0 0}
h1{font-size:clamp(30px,7vw,42px);line-height:1.2;letter-spacing:-.04em;margin:14px 0}h2{font-size:23px;line-height:1.4;margin:16px 0 18px}p{margin:10px 0}.muted{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;transition:transform .12s,background .12s}button:active{transform:scale(.99)}.primary{display:block;width:100%;border:0;border-radius:15px;background:var(--green);color:#fff;padding:14px 18px;font-weight:650;margin-top:22px}.option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin:10px 0;color:var(--ink);line-height:1.45}.option:hover,.option:focus{border-color:var(--green);background:var(--soft);outline:none}.letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:#f3f0e9;color:var(--green);font-size:13px;font-weight:700}
.progress{height:5px;background:#eae5dc;border-radius:9px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:var(--green);width:0;transition:width .2s}.topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.nav{display:flex;gap:10px;margin-top:16px}.secondary{flex:1;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--muted)}.result{text-align:center}.animal{font-size:68px;line-height:1.2;margin:18px 0}.result h2{font-size:29px;margin:4px 0 10px}.keywords{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:18px 0}.keyword{background:var(--soft);color:#536858;border-radius:99px;padding:5px 11px;font-size:13px}.result-copy{background:#f8f5ef;border-radius:17px;padding:17px;text-align:left;margin:20px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border-radius:13px;padding:12px;border:1px solid var(--line);background:#fff}.actions .primary{margin:0;background:var(--green);color:white;border:0}.foot{font-size:12px;color:#969187;text-align:center;margin:18px 0 0}
@media(max-width:400px){body{padding:14px 10px}.card{border-radius:21px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body><main><section class="card">
<div class="eyebrow">LITTLE TEST STUDIO · ANIMAL ARCHETYPE</div>
<div id="app">
<h1>你是什么动物塑？</h1>
<p>如果把你的性格比作一种动物，会是什么？从相处方式、直觉反应和生活节奏里，找到最像你的动物原型。</p>
<div><span class="pill">15 道选择题</span><span class="pill">约 3 分钟</span><span class="pill">8 种动物原型</span></div>
<button class="primary" onclick="start()">开始看看 →</button>
<p class="foot">没有标准答案，凭第一直觉选就好。</p>
</div></section><p class="foot">仅供娱乐与自我探索，不构成专业心理评估。</p></main>
<script>
const types=[
{name:"黑猫",emoji:"🐈‍⬛",desc:"你有自己的节奏和边界，不会轻易对所有人敞开心扉。熟悉之后，你的柔软、幽默和依赖感才会慢慢出现。你不需要成为人群里最热闹的那个，也能有很强的存在感。",tags:["独立慢热","边界感","反差温柔"],share:"外表淡定，内心有自己的小宇宙。"},
{name:"狐狸",emoji:"🦊",desc:"你反应快、适应力强，遇到变化时通常能找到新办法。你善于读懂气氛，也不喜欢把自己困在单一答案里。你的魅力在于灵活、有趣，而且总有一点让人猜不透。",tags:["机敏灵活","会读气氛","点子很多"],share:"聪明又灵动，最擅长见招拆招。"},
{name:"雪豹",emoji:"🐆",desc:"你更习惯安静地观察，而不是急着证明自己。你重视个人空间，目标明确时又有很强的专注力。你不一定争抢注意力，但在重要的事情上相当坚定。",tags:["安静专注","自持独立","韧性很强"],share:"不争一时风头，但自有自己的节奏。"},
{name:"白狼",emoji:"🐺",desc:"你看重承诺、信任和并肩作战的感觉。对不熟的人你可能有所保留，但一旦认定了谁，就会认真投入，也愿意在关键时刻站出来保护重要的人。",tags:["重情重义","原则感","保护欲"],share:"认定了就坚定，是可靠的同伴型。"},
{name:"鹿",emoji:"🦌",desc:"你对细微的情绪和环境变化很敏感，常常能察觉别人没说出口的感受。温和并不代表没有主见，你只是更愿意用柔软的方式处理事情，也有自己的韧性。",tags:["细腻温柔","共情力","柔韧坚定"],share:"温柔不是软弱，是一种很特别的力量。"},
{name:"兔子",emoji:"🐇",desc:"你有亲和、轻盈的一面，也很懂得保护自己的能量。你可能需要一点时间适应新环境，但熟悉之后会展现活泼、可爱又有主见的一面。谨慎和勇敢在你身上可以同时存在。",tags:["灵动亲和","慢热谨慎","柔软有主见"],share:"看起来软萌，实际很清楚自己要什么。"},
{name:"大熊猫",emoji:"🐼",desc:"你有亲和、松弛的一面，不喜欢为了迎合别人而勉强自己。熟悉的人面前，你可以很可爱也很有主见；你重视舒服的节奏，也懂得给自己留一点空间。",tags:["松弛可爱","温和有主见","自有节奏"],share:"不必一直努力表现，做自己就很讨喜。"},
{name:"猫头鹰",emoji:"🦉",desc:"你习惯先观察再行动，对细节和信息很敏锐。比起跟着人群走，你更愿意自己想清楚；安静的时候，你往往已经留意到了很多别人忽略的东西。",tags:["观察敏锐","理性思考","独立判断"],share:"先看清细节，再做自己的判断。"}
];
// 每个选项都有明确的原型倾向；各题轮换映射，避免固定选某个字母就总得到同一种动物。
const qs=[
["走进一片陌生森林，你第一眼会注意什么？",["哪里安静、适合自己待一会儿","哪条小路看起来最有意思","周围有没有同伴或需要帮助的小动物","树枝、脚印和环境里藏着什么线索"]],
["如果突然听到身后有动静，你会？",["先停下来，保持距离观察","轻巧地换个方向，看看发生什么","确认身边的人都没被吓到","不急着动，先分辨声音来自哪里"]],
["你最想拥有哪种超能力？",["随时进入自己的隐秘空间","快速适应任何新环境","感知重要之人的情绪","看见事物背后隐藏的线索"]],
["选一个最舒服的窝，你会选？",["高处、隐蔽、没人打扰的小角落","能通向很多地方的灵活据点","温暖柔软、适合和伙伴待在一起的窝","视野开阔、方便观察四周的地方"]],
["野外探险时，你最像队伍里的谁？",["按自己的节奏探索，不盲目跟队","发现新路线，还能随机应变","留意大家状态，确保没人掉队","记住地形和细节，提前判断风险"]],
["面对一扇神秘的门，你会怎么做？",["先确认里面是否允许自己自在行动","找找有没有别的入口或有趣机关","想想一起进去的人是否都准备好了","仔细检查门上的符号和痕迹"]],
["哪种天气最像你的能量状态？",["夜色安静，适合独处和恢复","风吹云动，充满变化和可能","阳光温暖，适合靠近熟悉的人","雨后清晰，适合思考和观察"]],
["如果可以选择一种移动方式？",["悄无声息地穿过自己的路线","轻快敏捷，随时改变方向","和伙伴并肩前进，彼此照应","从高处看清全局，再决定路线"]],
["你会把什么当作自己的宝物？",["只属于自己的秘密收藏","旅行途中遇到的新奇小物","朋友送的纪念品或共同回忆","能解开谜题的地图或旧笔记"]],
["发现一处隐秘花园，你会？",["找个角落安静享受，不想被打扰","四处探索，看看还有什么惊喜","想带亲近的人一起来分享","先观察花草、路径和不寻常的细节"]],
["你更喜欢哪种游戏任务？",["潜行、独立行动、完成个人目标","探索地图、收集新发现、灵活通关","组队协作、保护队友、共同达成目标","解谜、追踪线索、提前布局"]],
["遇到一条陌生小路，你的直觉是？",["只要不影响自己的节奏，就慢慢走","走走看，说不定有惊喜","看看伙伴是否也愿意一起去","先观察路况，判断是否安全"]],
["如果动物朋友们要给你分工，你更适合？",["守着自己的领地，关键时刻再出现","当机动 scout，哪里都能去看看","照顾队伍，让大家保持安心","负责观察、记路和发现隐藏信息"]],
["哪种小习惯最像你？",["喜欢有自己的固定角落和仪式感","想到就尝试，不爱被一种方法限制","会记得别人喜欢什么、需要什么","常常注意到不起眼的小变化"]],
["选一句作为你的动物生存法则？",["保持自由，也守好自己的边界","灵活一点，世界处处有新路","珍惜同伴，温柔也有力量","先观察，再用自己的判断行动"]]
];
const map=[
[0,1,4,6],[2,1,5,7],[0,1,4,3],[2,1,5,6],[0,1,4,7],
[2,1,3,6],[0,1,4,7],[2,1,3,6],[0,1,5,7],[2,1,4,6],
[0,1,3,7],[2,1,4,6],[0,1,5,7],[2,1,3,6],[0,1,4,7]
];
let index=0,answers=[];
const app=document.getElementById("app");
function start(){index=0;answers=[];renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){
const q=qs[index];const percent=Math.round(index/qs.length*100);
app.innerHTML='<div class="topline"><span>动物塑探索</span><span>第 '+(index+1)+' / '+qs.length+' 题</span></div><div class="progress"><div class="bar" style="width:'+percent+'%"></div></div><h2>'+q[0]+'</h2><div>'+q[1].map((x,j)=>'<button class="option" onclick="pick('+j+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+x+'</span></button>').join('')+'</div><div class="nav">'+(index?'<button class="secondary" onclick="back()">← 上一题</button>':'<button class="secondary" onclick="home()">返回介绍</button>')+'</div>';
}
function home(){app.innerHTML='<h1>你是什么动物塑？</h1><p>如果把你的性格比作一种动物，会是什么？从相处方式、直觉反应和生活节奏里，找到最像你的动物原型。</p><div><span class="pill">15 道选择题</span><span class="pill">约 3 分钟</span><span class="pill">8 种动物原型</span></div><button class="primary" onclick="start()">开始看看 →</button><p class="foot">没有标准答案，凭第一直觉选就好。</p>'}
function back(){if(index>0){index--;renderQuestion();}}
function pick(n){answers[index]=n;if(index<qs.length-1){index++;renderQuestion();}else finish();}
function finish(){
const scores=Array(types.length).fill(0);
answers.forEach((answer,qi)=>{scores[map[qi][answer]]+=1;});
// 轻微平局裁决：优先采用用户更早作答支持的原型，结果稳定可解释。
const max=Math.max(...scores);let winner=scores.indexOf(max);
if(scores.filter(v=>v===max).length>1){for(let k=0;k<answers.length;k++){const t=map[k][answers[k]];if(scores[t]===max){winner=t;break;}}}
const t=types[winner];const second=scores.map((v,i)=>({v,i})).filter(x=>x.i!==winner).sort((a,b)=>b.v-a.v)[0];
app.innerHTML='<div class="result"><div class="eyebrow">YOUR ANIMAL ARCHETYPE</div><div class="animal">'+t.emoji+'</div><p class="muted">你的动物塑是</p><h2>'+t.name+'</h2><p>'+t.share+'</p><div class="keywords">'+t.tags.map(x=>'<span class="keyword">'+x+'</span>').join('')+'</div></div><div class="result-copy"><strong>关于你的动物画像</strong><p>'+t.desc+'</p><p class="muted">你的第二倾向：'+types[second.i].name+'（'+types[second.i].emoji+'）</p></div><div class="actions"><button class="primary" onclick="copyResult('+winner+')">复制我的结果</button><button onclick="start()">再玩一次 ↻</button></div><p class="foot">结果由全部 15 道答案累计得出。仅供娱乐与自我探索，不构成专业心理评估。</p>';
window.scrollTo({top:0,behavior:"smooth"});
}
function copyResult(winner){const t=types[winner];const text='我的动物塑是 '+t.emoji+t.name+'！'+t.share+'\n你是什么动物塑？';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert("结果文案已复制，可以去分享啦！")).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const el=document.createElement("textarea");el.value=text;document.body.appendChild(el);el.select();try{document.execCommand("copy");alert("结果文案已复制，可以去分享啦！");}catch(e){alert(text);}el.remove();}
</script></body></html>
