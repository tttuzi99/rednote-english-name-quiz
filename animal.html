<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你是什么动物塑？</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1ec;color:#292b2b;max-width:650px;margin:25px auto;padding:16px}.box{background:#fffdf9;border-radius:24px;padding:24px}button{font:inherit;border:0;border-radius:12px;padding:12px;background:#788875;color:white;width:100%;cursor:pointer}p{line-height:1.7}.muted{color:#777}</style><div class="box"><p class="muted">LITTLE TEST STUDIO · ANIMAL ARCHETYPE</p><h1>你是什么动物塑？</h1><p>从你的相处方式、直觉反应和生活节奏里，找到最像你的动物原型。15 道题，约 3 分钟。</p><button onclick="start()">开始测试 →</button><div id="app"></div></div><script>
const types=[["黑猫","🐈‍⬛","独立慢热，有自己的边界；只对真正信任的人展露柔软。关键词：独立、神秘、有边界。"],["狐狸","🦊","机敏灵活，擅长读懂情境，也总能找到新的解法。关键词：聪明、适应力、狡黠。"],["雪豹","🐆","安静克制，不爱无谓竞争，重要时刻却很有韧性。关键词：沉着、独立、专注。"],["白狼","🐺","重视信任与伙伴，对认定的人忠诚而有保护欲。关键词：忠诚、原则、保护欲。"],["鹿","🦌","细腻温和，能察觉情绪变化，也有柔韧的勇气。关键词：温柔、敏锐、坚韧。"],["兔子","🐇","亲和灵动，慢热但不胆小，会认真保护自己的能量。关键词：灵动、柔软、谨慎。"],["乌鸦","🐦‍⬛","观察敏锐，喜欢复杂有层次的事物，常注意到细节。关键词：洞察、好奇、独特。"],["蛇","🐍","沉着有耐心，擅长等待时机，也懂得自我更新。关键词：冷静、耐心、蜕变。"]];
const qs=[["临时计划被打乱，你会？",["重新安排自己的节奏","灵活调整，寻找新机会","先照顾自己的情绪","观察这是不是常态"]],["到了陌生聚会，你会？",["先观察，再决定和谁聊天","主动找有趣的人聊聊","先找舒服的位置适应","留意大家忽略的细节"]],["发生意见冲突，你更常？",["清楚表达边界","寻找灵活的折中办法","先理解对方感受","不急着争论，观察行动"]],["理想的休息日是？",["独处做喜欢的事","探索没去过的地方","和亲近的人待在一起","沉浸研究感兴趣的主题"]],["别人误解你，你会？",["只向重要的人解释","换个方式说清楚","温和地确认彼此理解","判断是否值得解释"]],["团队里你通常？",["独立完成自己的部分","临场补位解决问题","照顾大家的感受","提前发现风险和漏洞"]],["最受不了哪种相处？",["没有边界感","死板不懂变通","冷漠缺少回应","表里不一"]],["做决定时你更相信？",["长期观察后的判断","试过再调整","自己的感受和信任的人","信息与潜在风险"]],["更喜欢什么环境？",["安静且有私人空间","变化多、充满新鲜感","温暖舒适","有深度、不浮躁"]],["哪种夸奖最打动你？",["有自己的风格","聪明又有办法","温柔可靠","敏锐而冷静"]],["喜欢一个人或一件事时？",["慢慢靠近，确认边界","主动创造机会","认真回应并持续付出","观察很久，一旦认定就坚定"]],["压力大时你会？",["抽离一会恢复秩序","换方法打破僵局","找信任的人聊聊","分析原因并制定步骤"]],["朋友眼中的你？",["有点神秘，很有主见","反应快，点子多","好相处，愿意倾听","冷静敏锐，注意细节"]],["如果要守护一样东西？",["自由和内心空间","探索世界的机会","重要的人和信任","原则与长远目标"]],["哪句话更像你？",["不必被所有人理解","路不对就换种走法","温柔也可以有力量","看清之后再行动"]]];
let i=0,a=[];function start(){i=0;a=[];render()}function render(){let q=qs[i],d=document.getElementById('app');d.innerHTML='<p class="muted">第 '+(i+1)+' / 15 题</p><h2>'+q[0]+'</h2>'+q[1].map((x,j)=>'<p><button onclick="pick('+j+')">'+String.fromCharCode(65+j)+' · '+x+'</button></p>').join('')+(i?'<button onclick="back()">← 上一题</button>':'')}function back(){i--;render()}function pick(n){a[i]=n;if(i<14){i++;render()}else finish()}function finish(){let s=Array(8).fill(0);a.forEach((v,j)=>s[(v+j*3)%8]++);let t=types[s.indexOf(Math.max(...s))];document.getElementById('app').innerHTML='<h2>'+t[1]+' 你的动物塑是：'+t[0]+'</h2><p>'+t[2]+'</p><p class="muted">这是趣味画像，不是专业心理测评。</p><button onclick="start()">重新测试</button>'}
</script></html>
