<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3f0"><meta name="description" content="你是哪种动物系？"><title>你是哪种动物系？</title><style>
:root{--bg:#f7f3f0;--paper:#fffdfa;--ink:#332f33;--muted:#827981;--accent:#987d91;--accent2:#e9dce5;--line:#ece5e9;--soft:#f4edf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;padding:20px 14px 34px}button{font:inherit;cursor:pointer}.app{max-width:520px;margin:0 auto}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.08em;margin:4px 2px 20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:0 8px 28px #65515a0a}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}.hero{padding:8px 2px 18px}.hero h1{font-size:32px;line-height:1.3;letter-spacing:-.04em;margin:12px 0 14px;font-weight:750}.hero p{color:var(--muted);margin:0;font-size:15px}.deco{height:5px;width:58px;border-radius:9px;background:var(--accent2);margin:20px 0}.note{font-size:12px;color:var(--muted);margin-top:14px}.primary{width:100%;border:0;border-radius:15px;background:var(--accent);color:white;padding:14px 18px;font-weight:650;margin-top:22px}.secondary{border:1px solid var(--line);background:transparent;border-radius:13px;padding:10px 14px;color:var(--ink)}.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.progress{height:4px;background:#eee7ec;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar{height:100%;background:var(--accent);width:10%;transition:width .2s}.qtitle{font-size:22px;line-height:1.45;margin:0 0 22px;letter-spacing:-.025em}.options{display:grid;gap:10px}.option{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fffdfa;color:var(--ink);line-height:1.5;min-height:58px}.letter{width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:#f3edf2;color:#897488;display:grid;place-items:center;font-size:12px}.option:active,.option.selected{border-color:var(--accent);background:var(--soft)}.nav{display:flex;gap:10px;margin-top:20px;align-items:center}.tiny{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}.result-kicker{font-size:12px;color:var(--accent);letter-spacing:.12em;font-weight:700}.result h1{font-size:31px;line-height:1.28;letter-spacing:-.04em;margin:8px 0}.subtitle{font-size:17px;line-height:1.5;color:#665765;margin:0 0 22px}.result p{margin:0 0 16px}.section{border-top:1px solid var(--line);padding-top:17px;margin-top:19px}.section h2{font-size:15px;margin:0 0 8px}.quote{background:var(--soft);padding:16px;border-radius:16px;font-weight:650;line-height:1.6;margin-top:20px}.tag{display:inline-block;font-size:12px;background:#f3edf2;color:#7b647a;padding:5px 10px;border-radius:99px;margin:2px 5px 8px 0}.result-actions{display:grid;gap:10px;margin-top:22px}.result-actions .primary{margin:0}.hidden{display:none!important}@media(min-width:500px){body{padding-top:34px}.panel{padding:30px 28px}.hero h1,.result h1{font-size:36px}}</style></head><body><main class="app"><div class="topline"><span>JUST FOR FUN</span><span>轻松了解自己</span></div>
<section id="home" class="panel"><div class="hero"><div class="eyebrow">ANIMAL PERSONALITY</div><h1>你是哪种动物系？</h1><p>从日常相处、做决定和面对新环境的反应，看看你更像哪种熟悉的动物。不是外貌分类，也不靠玄学，选最像平时自己的那个。</p><div class="deco"></div><p>没有标准答案，按平时的自然反应选就好。</p></div><button class="primary" id="start">开始看看 →</button><div class="note">约 2 分钟 · 10 道单选题 · 没有标准答案</div></section>
<section id="quiz" class="panel hidden"><div class="progressrow"><span id="step">QUESTION 01</span><span id="count">1 / 10</span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question" class="qtitle"></h2><div id="options" class="options"></div><div class="nav"><button class="secondary" id="prev">← 上一题</button><span class="tiny" style="flex:1;text-align:right;margin:auto 0">点选答案，自动进入下一题</span></div><div class="tiny">选最接近你平时反应的答案，不用选“看起来最好”的。</div></section>
<section id="result" class="panel result hidden"><div class="result-kicker">YOUR RESULT</div><div id="rtype" class="tag"></div><h1 id="rtitle"></h1><p id="rsubtitle" class="subtitle"></p><div id="rbody"></div><div class="quote" id="quote"></div><div class="section"><h2>给你的小提示</h2><p id="tip"></p></div><div class="result-actions"><button class="primary" id="again">再看一次</button><button class="secondary" id="copy">复制我的结果</button></div><div class="tiny">这是趣味画像，不定义你的全部。</div></section></main>
<script>const DATA={"title":"你是哪种动物系？","subtitle":"从日常相处、做决定和面对新环境的反应，看看你更像哪种熟悉的动物。不是外貌分类，也不靠玄学，选最像平时自己的那个。","eyebrow":"ANIMAL PERSONALITY","types":{"cat":{"name":"猫系","sub":"你需要自己的空间，但并不代表你不在乎。","desc":"你有自己的节奏，不喜欢被追着安排，也不太会为了合群强行改变喜好。熟悉之后，你会用很自然的方式表达在意：记住对方的习惯、默默陪着，或者只在特定的人面前放松下来。你不一定热情外放，但关系对不对，你心里很清楚。","moment":"在人多的地方先观察一会儿，熟了之后才开始主动加入；对在意的人，会记得那些别人没注意的小事。","blind":"你觉得自己已经表达得够明显，别人却可能只看到你的安静。偶尔把在意说出来，不会让你失去自由。","quote":"不是谁都能靠近你，但靠近之后，就能看到更真实的你。","tip":"保留独处时间，也给重要的人一点明确的回应。"},"dog":{"name":"狗系","sub":"你喜欢的东西，会大大方方地放进生活里。","desc":"你重视陪伴和回应，不太爱把关系变成猜谜游戏。喜欢一起做事、分享日常，也愿意让别人知道自己在乎什么。你带来的安全感不是因为永远情绪稳定，而是大多数时候都愿意沟通、愿意靠近。","moment":"别人随口提了一句想做的事，你会真的记住；有空的时候也很愿意主动约人。","blind":"你可能会把自己的热情当成理所当然，遇到回应不对等时又不太舍得收回来。","quote":"你不怕主动，因为对你来说，真诚比输赢重要。","tip":"主动很好，但也观察对方有没有用自己的方式回应你。"},"fox":{"name":"狐狸系","sub":"你反应快，也很会看懂场面里的小变化。","desc":"你对环境和人的反应比较敏锐，常能察觉话题什么时候该接、什么时候适合停。你不一定喜欢成为焦点，但通常不会让自己完全被动。遇到有趣的人或事，你会用一点机灵和幽默打开局面。","moment":"大家还没反应过来时，你已经找到一个轻松的说法，把有点尴尬的场面接住了。","blind":"你很会观察，也可能因此想太多。不是每次沉默都有含义，不必替所有人解读。","quote":"你不是在算计每一步，只是比别人更早注意到变化。","tip":"把聪明用来创造轻松感，而不是反复猜别人怎么想。"},"rabbit":{"name":"兔系","sub":"你对细微变化很敏感，也很看重相处的安全感。","desc":"你通常不喜欢过度强势或节奏太快的相处方式。你会先确认环境是不是舒服、对方是不是可靠，再慢慢放松下来。熟悉之后，你的可爱、好奇和小脾气都会更明显。","moment":"刚到陌生环境时先找一个熟悉的人或角落，等气氛舒服了才开始自在聊天。","blind":"你有时会因为怕打扰而把需求藏起来。真正合适的人，不会要求你永远懂事。","quote":"你不是胆小，只是需要先确认这里值得放心。","tip":"可以慢一点，但不必总等别人来猜你的感受。"},"owl":{"name":"猫头鹰系","sub":"你习惯先看清楚，再决定要不要投入。","desc":"面对新鲜事，你会先收集信息、观察规则，弄明白之后才开始行动。你不太容易被一时热闹带着走，更在意事情是否合理、值不值得。别人可能觉得你慢热，其实你只是希望自己的选择有依据。","moment":"大家急着做决定时，你会先问清楚条件，发现一个被忽略的关键点。","blind":"准备得太充分，有时反而会错过尝试的时机。并不是每件事都需要先研究透。","quote":"你不急着抢答，因为你更想给出真正靠谱的答案。","tip":"遇到低风险的新事物，允许自己先体验，再总结。"},"bear":{"name":"熊系","sub":"你不一定话多，但常常是让人觉得稳的那个。","desc":"你更偏向用行动解决问题，不太喜欢把简单的事弄得很复杂。朋友遇到麻烦时，你会想办法帮一把；需要休息时，也希望别人别把你的安静误会成不高兴。你看重舒服、稳定、说到做到。","moment":"别人还在讨论怎么办，你已经默默把能处理的部分先做好了。","blind":"你习惯扛事，可能不太会主动求助。可靠不代表所有事情都该你负责。","quote":"你给人的踏实感，不靠漂亮话，靠的是关键时刻真的在。","tip":"需要帮忙时直接说，照顾自己也是一种负责。"},"otter":{"name":"水獭系","sub":"你喜欢把普通日子过得有参与感。","desc":"你容易被有趣的小事点亮，也喜欢和人一起体验新东西。比起把生活安排得滴水不漏，你更在意过程有没有意思、有没有一起笑出来的瞬间。你能带动气氛，但不必每时每刻都负责让所有人开心。","moment":"本来只是出门买个东西，最后因为临时起意多绕了几站，还收获了一段好玩的经历。","blind":"你容易答应太多有趣的邀约，等到真正需要休息时才发现日程已经排满。","quote":"你很会发现生活的小彩蛋，也愿意拉别人一起看。","tip":"保留好奇心，也给自己留一点什么都不做的时间。"},"deer":{"name":"鹿系","sub":"你有自己的审美和边界，不喜欢被粗暴地对待。","desc":"你对氛围、表达方式和相处分寸比较敏感。你不一定要求所有人都懂自己，但希望彼此能尊重差异，不用过分直接的方式压过对方。熟悉之后，你会展现出坚定的一面，只是不爱用强硬来证明。","moment":"你能察觉一句话是不是太重，也会用更周到的方式表达不同意见。","blind":"你可能为了维持和气，太晚才说出真正的不舒服。温和表达边界并不等于制造冲突。","quote":"你的温柔不是没有立场，而是选择了更舒服的表达方式。","tip":"不必等到忍无可忍才拒绝，早点说清楚会更轻松。"}},"qs":[["到了一个全是陌生人的聚会，你通常会？",[["先找个舒服的位置观察一下","owl"],["主动和看起来好相处的人聊起来","dog"],["先看看现场气氛，再决定怎么加入","fox"],["有熟人就先待在熟人旁边","rabbit"]]],["周末突然空出半天，你最想？",[["窝着休息，按自己的节奏来","cat"],["约个熟人一起吃饭散步","dog"],["临时找个新地方逛逛","otter"],["做点一直想做、但没来得及的事","owl"]]],["朋友遇到麻烦来找你，你第一反应是？",[["先问清楚发生了什么，再分析办法","owl"],["直接看看有什么事我能帮上忙","bear"],["先陪对方缓一缓，确认他想要什么","deer"],["用轻松一点的方式让对方别那么紧绷","otter"]]],["计划临时被打乱时，你更像？",[["没关系，换个玩法也可以","otter"],["先确认改动会不会影响其他安排","owl"],["看情况灵活调整，不太慌","fox"],["会有点不适应，需要一点时间重新进入状态","rabbit"]]],["别人误会你了，你更可能？",[["直接说清楚，不想让误会拖着","dog"],["先观察对方是误解还是根本没在听","fox"],["如果关系重要，会找机会认真解释","deer"],["不太想争，先自己消化一下","cat"]]],["在一群朋友里，你经常是？",[["那个不吵闹但能稳稳帮上忙的人","bear"],["能把话题接起来、发现大家情绪变化的人","fox"],["和熟人特别亲近、会主动表达的人","dog"],["更喜欢听大家聊，偶尔说一句关键的","owl"]]],["你更受不了哪种相处方式？",[["别人总要求我随叫随到","cat"],["有事不说，非要让我猜","dog"],["讲话不顾别人感受，完全不看场合","deer"],["什么都要按固定流程，一点变化都不行","otter"]]],["买东西或选活动时，你通常？",[["先查评价和信息，比较之后再决定","owl"],["看当下有没有感觉，喜欢就去试试","otter"],["优先考虑大家都能不能玩得舒服","bear"],["凭直觉先筛一轮，再观察细节","fox"]]],["当你真的信任一个人时，你会？",[["更愿意分享日常，也会主动找对方","dog"],["在对方面前放松，不用一直说话","cat"],["表现出平时不太给人看的小情绪和可爱","rabbit"],["愿意认真谈自己的想法和边界","deer"]]],["你觉得自己最明显的特点是？",[["独立，有自己的节奏","cat"],["真诚，愿意回应别人","dog"],["机灵，擅长随机应变","fox"],["细腻，容易感受到气氛变化","deer"]]]],"kind":"animal"};let idx=0,answers=Array(DATA.qs.length).fill(null),advancing=false;const $=id=>document.getElementById(id);function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function renderQ(){const q=DATA.qs[idx];$("step").textContent="QUESTION "+String(idx+1).padStart(2,"0");$("count").textContent=(idx+1)+" / "+DATA.qs.length;$("bar").style.width=((idx+1)/DATA.qs.length*100)+"%";$("question").textContent=q[0];$("options").innerHTML="";q[1].forEach((o,i)=>{const b=document.createElement("button");b.className="option";b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span></span>';b.querySelector("span:last-child").textContent=o[0];b.onclick=()=>{if(advancing)return;answers[idx]=i;b.classList.add("selected");advancing=true;setTimeout(()=>{advancing=false;if(idx<DATA.qs.length-1){idx++;renderQ()}else finish()},180)};$("options").appendChild(b)});$("prev").style.visibility=idx===0?"hidden":"visible"}function finish(){const scores={};Object.keys(DATA.types).forEach(k=>scores[k]=0);answers.forEach((a,i)=>{if(a!==null)scores[DATA.qs[i][1][a][1]]++});const max=Math.max(...Object.values(scores));const tied=Object.keys(scores).filter(k=>scores[k]===max);let winner=tied[0];for(let i=answers.length-1;i>=0;i--){const key=DATA.qs[i][1][answers[i]][1];if(tied.includes(key)){winner=key;break}}const t=DATA.types[winner];$("rtype").textContent="你的类型";$("rtitle").textContent=t.name;$("rsubtitle").textContent=t.sub;$("rbody").innerHTML='<p>'+t.desc+'</p><div class="section"><h2>你最有代表性的瞬间</h2><p>'+t.moment+'</p></div><div class="section"><h2>你可能没注意到的另一面</h2><p>'+t.blind+'</p></div>';$("quote").textContent=t.quote;$("tip").textContent=t.tip;show("result")}function reset(){idx=0;advancing=false;answers=Array(DATA.qs.length).fill(null)}$("start").onclick=()=>{reset();show("quiz");renderQ()};$("prev").onclick=()=>{if(idx>0&&!advancing){idx--;renderQ()}};$("again").onclick=()=>{reset();show("home")};$("copy").onclick=async()=>{const t=DATA.types[Object.keys(DATA.types).find(k=>DATA.types[k].name===$("rtitle").textContent)];const text=DATA.title+"\n我的结果："+t.name+"\n"+t.sub+"\n"+t.quote;try{await navigator.clipboard.writeText(text);$("copy").textContent="已复制 ✓"}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("copy").textContent="已复制 ✓"}};</script></body></html>
