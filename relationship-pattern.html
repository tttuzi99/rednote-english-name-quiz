<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1ed">
<title>你在亲密关系里，最容易输在哪一步？</title>
<style>
:root{--ink:#302d2c;--muted:#817873;--paper:#f6f1ed;--card:#fffdfa;--accent:#a56f76;--line:#eadfdc;--soft:#f5e9e8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px 14px}main{max-width:620px;margin:0 auto}.card{background:var(--card);border:1px solid #eadfdc99;border-radius:24px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 36px #533c2d0a}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:750}.muted{color:var(--muted);font-size:14px}h1{font-size:clamp(28px,7vw,38px);line-height:1.28;letter-spacing:-.04em;margin:14px 0}h2{font-size:22px;line-height:1.45;margin:18px 0}p{margin:10px 0}button{font:inherit;cursor:pointer}.primary,.secondary{border-radius:14px;padding:13px 16px;font-weight:650}.primary{display:block;width:100%;border:0;background:var(--accent);color:white;margin-top:22px}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin:10px 0;color:var(--ink);line-height:1.5;min-height:52px}.option.selected{border-color:var(--accent);background:var(--soft)}.letter{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:9px;background:#f6efec;color:var(--accent);font-size:12px;font-weight:700}.progress{height:5px;background:#eee4e0;border-radius:9px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;background:var(--accent)}.topline{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.nav{display:flex;gap:10px;margin-top:18px}.nav button{width:100%}.result{text-align:center;padding:8px 0 16px}.emoji{font-size:54px;line-height:1.4}.result-copy{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.tagline{display:inline-block;border-radius:99px;background:var(--soft);padding:5px 10px;font-size:13px;color:#81535a;margin:4px}.item{padding:10px 0;border-top:1px solid var(--line)}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}button:focus-visible{outline:3px solid #c99ba1;outline-offset:3px}
</style></head>
<body><main><div class="card" id="app"><div class="eyebrow">A LITTLE LOVE CHECK · RELATIONSHIP PATTERNS</div><h1>你在亲密关系里，<br>最容易输在哪一步？</h1><p>有时候不是不够喜欢，而是总在相似的地方拧巴：想确认又怕显得在意，受了委屈先说没事，或者一认真就忍不住想很多。</p><p class="muted">12 道日常情境题，看看你在关系里容易卡住的环节，以及可以怎么调整。</p><button class="primary" onclick="start()">看看我容易卡在哪 →</button><p class="foot">没有标准答案，按你真实会做的选择来答。</p></div></main>
<script>
const results=[
{title:"暧昧期：容易把信号看得太重",emoji:"🔎",subtitle:"还没确定关系，心里已经反复复盘",desc:"你对关系里的细节比较敏锐。对方回复快慢、语气变化、主动程度，都可能被你拿来判断自己有没有机会。你不是想太多这么简单，而是很希望在投入之前，先弄清楚自己是否被认真对待。",pattern:"你可能会反复回看聊天、揣测一句话的意思，或把对方偶尔的热情当成关系即将推进的信号。结果是还没真正了解对方，就已经消耗了不少情绪。",try:"把注意力从单次信号移到持续行为：对方是否主动发起交流、是否兑现约定、是否愿意安排下一次见面。给自己一个观察周期，不急着用一天的热度下结论。",say:"“跟你聊天挺开心的，有空可以一起去试试那家店。”用轻松、明确的小邀请代替长时间猜测。",remind:"有好感不丢脸，但你不需要靠解读每个细节来证明自己值得被喜欢。"},
{title:"关系升温：容易把需求藏起来",emoji:"🤐",subtitle:"嘴上说都可以，心里却希望对方能懂",desc:"你可能很在意相处的和谐，不想显得麻烦，也担心表达需求会破坏气氛。于是你习惯先配合、先体谅，等到失望积累起来，才发现对方根本不知道你在意什么。",pattern:"你可能会说“没关系”“随便”“我都行”，期待对方从语气里察觉真正的想法。对方没察觉时，你又容易觉得自己没有被放在心上。",try:"把模糊暗示换成具体请求。需求不是命令，也不是考验；清楚表达能让对方有机会回应，你也能更早看见彼此是否合拍。",say:"“我其实更想去这家。下次安排约会时，你也可以先问问我想做什么。”",remind:"真正舒服的关系，不是永远不麻烦别人，而是你们都能坦然提出需要，也能商量着回应。"},
{title:"投入之后：容易把对方放在自己前面",emoji:"🫶",subtitle:"很会照顾关系，却容易忘了照顾自己",desc:"一旦认真，你就愿意花时间、精力去理解对方、配合对方。你可能把“我再体谅一点”当成解决问题的方法，直到自己的安排、情绪和底线被一点点挤到后面。",pattern:"你可能会为了对方反复调整计划，替对方解释失约或冷淡，也会在不舒服时先问自己是不是太敏感。付出本身没错，问题是关系逐渐变成了单方面维持。",try:"观察付出是否有来有回，而不是精确计算谁做得更多。每次想迁就之前，先问自己：这是我真心愿意，还是我怕拒绝后对方就不喜欢我？",say:"“我愿意陪你处理这件事，不过我今晚也需要休息，我们明天再一起想办法。”",remind:"体谅对方和委屈自己不是一回事。你也应该是这段关系里被照顾的人。"},
{title:"发生矛盾：容易先防御或冷下来",emoji:"🧊",subtitle:"明明在意，却很难在当下好好说",desc:"冲突出现时，你可能会立刻解释自己、反驳对方，或者干脆沉默，等情绪过去再说。你并非不想解决，只是当下容易觉得自己被误解、被指责，第一反应是保护自己。",pattern:"对话可能很快从“这件事让我不舒服”变成“你为什么总这样”，或者你表面说没事，心里却一直记着。问题没有被解决，距离反而越来越远。",try:"先把争论从“谁对谁错”拉回具体事件。情绪太满时可以暂停，但约好什么时候继续谈；重点说行为、感受和请求，避免翻旧账或给对方贴标签。",say:"“刚才那句话让我有点受伤。我想先缓一会儿，晚点我们再把这件事说清楚。”",remind:"暂停是为了回来沟通，不是让对方一直猜。修复关系不需要立刻赢得争论。"},
{title:"关系稳定后：容易把不安变成反复确认",emoji:"🌧️",subtitle:"越在乎，越想确认自己仍然重要",desc:"当关系变得重要，你可能会特别留意对方有没有变冷淡，并通过追问、试探或反复确认来寻找安全感。短暂的安慰能让你放松一会儿，但如果不安的来源没被说清，它很容易再次出现。",pattern:"你可能会问“你是不是不喜欢我了”，或者故意少回复、说反话，想看看对方会不会主动来找你。这样的测试往往让双方都疲惫，却没有真正回答你在担心什么。",try:"先区分事实和推测：对方这次没回消息是事实，“他不在乎我了”是解释。等情绪稳定后，具体谈谈你需要怎样的联系频率和回应方式，也听听对方的现实节奏。",say:"“最近我们联系少了一些，我有点想你。我们能不能商量一个彼此都舒服的联系节奏？”",remind:"安全感可以一起建立，但不需要靠测试对方来换。也要看对方是否愿意稳定回应你的合理需求。"},
{title:"做出选择：容易舍不得及时止损",emoji:"🧭",subtitle:"已经投入很多，于是很难承认不合适",desc:"你可能会记得关系里好的部分，也相信只要再努力一点、再给一点时间，事情就会变好。你珍惜感情并不是问题；真正让你受困的，是把过去的投入当成继续留下的理由。",pattern:"你可能不断降低期待，用偶尔的甜蜜抵消长期的失望，或反复想“都走到这一步了”。于是注意力集中在对方有一天会变成什么样，而不是他现在持续如何对待你。",try:"别只看承诺和高光时刻，连续观察一段时间里的实际行为。把自己的底线写清楚：哪些问题能协商，哪些行为反复发生就不能再接受。重大决定也可以和可信任的人讨论。",say:"“这件事我已经说过几次了。我需要看到持续的改变，而不只是当下的保证。”",remind:"离开一段不合适的关系不等于之前的付出都白费。你可以珍惜曾经，也可以重新为自己做选择。"}
];
const qs=[
["刚认识一个让你心动的人，你最容易？",["回想他说过的话，猜他是不是也有意思","尽量表现得好相处，不想给人压力","主动找话题，想办法拉近距离","先观察一阵，确认对方值得投入"]],
["对方隔了很久才回复消息，你会？",["琢磨是不是哪句话让他不高兴了","告诉自己没关系，不想显得计较","忍不住发点别的话试探他的反应","先忙自己的事，等有空再聊"]],
["约会安排和你的想法不一样时，你通常？",["先配合，之后再想是不是不够重视我","直接说出偏好，希望一起商量","当场有点不爽，语气可能变冲","如果经常不合适，会重新评估关系"]],
["你很需要对方陪伴，但他最近很忙，你会？",["反复确认他是不是还在乎我","说没事，尽量不增加他的负担","直接表达想念，也提出具体时间","看看彼此能否找到长期都可行的安排"]],
["一次小争执里，对方说你误会了，你会？",["回想细节，想弄清他真正的意思","先缓和气氛，自己的委屈晚点再说","立刻解释自己为什么这么想","暂停一下，等双方冷静后再谈"]],
["对方做了一件让你不舒服的事，你更可能？",["琢磨这是不是关系变差的信号","觉得算了，别因为小事扫兴","当下指出来，但容易越说越激动","看事情是否反复发生，再决定怎么处理"]],
["你发现自己付出比对方多时，你会？",["担心是不是自己不够好，才没得到回应","再多做一点，希望他能慢慢理解","忍不住抱怨，想让他立刻改变","认真看这段关系是否长期互相投入"]],
["关系进入平淡期，你最可能？",["特别留意他的热情有没有减少","主动制造惊喜，但不太说自己的期待","通过争执或试探确认对方在不在意","和对方讨论怎样调整相处节奏"]],
["你想拒绝对方一个请求时，通常？",["担心拒绝会不会影响他对我的看法","明明不方便，还是先答应下来","先答应，之后越想越委屈","说明自己的限制，再商量其他办法"]],
["同一个问题沟通过几次仍没改善，你会？",["想是不是自己理解错了他的态度","继续体谅，觉得他可能只是暂时做不到","忍到受不了时一次性爆发","看实际改变，重新确认自己的底线"]],
["对方突然变得特别热情，你会？",["立刻分析这是不是关系要升级的信号","担心自己回应不够，努力让他开心","迅速投入，希望趁热打铁","保持开心，也留时间观察是否稳定"]],
["回顾过去的关系，你最常遇到的遗憾是？",["总在猜对方的心意，没问清楚","太顾及对方，没说出真实需要","情绪上头时说了伤人的话","明知不合适，却因为舍不得拖很久"]]
];
// 六类结果按每题独立映射；各类在题目中均有机会得分，避免结果被选项位置锁定。
const key=[
[0,1,2,5],[0,4,1,5],[1,0,3,5],[4,1,0,5],[0,1,3,3],[0,1,3,5],
[4,1,3,5],[4,1,2,3],[0,1,3,5],[4,1,3,5],[0,1,2,5],[0,1,3,5]
];
let index=0,answers=[];const app=document.getElementById("app");
function start(){index=0;answers=Array(qs.length).fill(null);render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){const q=qs[index],pct=Math.round(index/qs.length*100);app.innerHTML='<div class="topline"><span>亲密关系观察室</span><span>第 '+(index+1)+' / '+qs.length+' 题</span></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><h2>'+q[0]+'</h2><div>'+q[1].map((x,j)=>'<button class="option'+(answers[index]===j?' selected':'')+'" onclick="pick('+j+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+x+'</span></button>').join('')+'</div><div class="nav"><button class="secondary" onclick="'+(index?'back()':'intro()')+'">'+(index?'← 上一题':'返回介绍')+'</button></div>';}
function intro(){index=0;answers=[];app.innerHTML='<div class="eyebrow">A LITTLE LOVE CHECK · RELATIONSHIP PATTERNS</div><h1>你在亲密关系里，<br>最容易输在哪一步？</h1><p>有时候不是不够喜欢，而是总在相似的地方拧巴：想确认又怕显得在意，受了委屈先说没事，或者一认真就忍不住想很多。</p><p class="muted">12 道日常情境题，看看你在关系里容易卡住的环节，以及可以怎么调整。</p><button class="primary" onclick="start()">看看我容易卡在哪 →</button><p class="foot">没有标准答案，按你真实会做的选择来答。</p>';}
function back(){if(index>0){index--;render();}}
function pick(n){answers[index]=n;if(index<qs.length-1){index++;render();}else finish();}
function finish(){const scores=Array(6).fill(0);answers.forEach((a,i)=>scores[key[i][a]]++);const sorted=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);const win=sorted[0].i,second=sorted.find(x=>x.i!==win).i,r=results[win];app.innerHTML='<div class="result"><div class="eyebrow">YOUR RELATIONSHIP PATTERN</div><div class="emoji">'+r.emoji+'</div><p class="muted">你最容易卡在</p><h2>'+r.title+'</h2><p>'+r.subtitle+'</p><p>'+r.desc+'</p></div><div class="result-copy"><strong>你可能会这样</strong><p>'+r.pattern+'</p></div><div class="result-copy"><strong>下一次，可以试着这样做</strong><p>'+r.try+'</p></div><div class="result-copy"><strong>一句可以直接用的话</strong><p>“'+r.say+'”</p></div><div class="result-copy"><strong>给你的提醒</strong><p>'+r.remind+'</p></div><div class="result-copy"><strong>你的次要倾向：'+results[second].title+'</strong><p>'+results[second].subtitle+'。你可能同时有两种模式，具体表现也会随关系和情境变化。</p></div><button class="primary" onclick="copyResult('+win+')">复制我的结果，分享给朋友</button><button class="secondary" style="width:100%;margin-top:10px" onclick="start()">重新测试 ↻</button><p class="foot">这是一份恋爱相处模式的趣味自我探索，不是心理诊断，也不代表关系的唯一结论。若关系中存在持续的控制、威胁或伤害，请优先考虑自身安全并寻求可信任的支持。</p>';window.scrollTo({top:0,behavior:"smooth"});}
function copyResult(i){const r=results[i],text='我在亲密关系里最容易卡在：'+r.title+'\n'+r.subtitle+'\n'+r.try+'\n你也来看看自己容易在哪一步卡住。';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert('结果文案已复制！')).catch(()=>fallback(text));}else fallback(text);}
function fallback(text){const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');alert('结果文案已复制！')}catch(e){alert(text)}el.remove();}
</script></body></html>
