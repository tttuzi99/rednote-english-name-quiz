function finish(){const scores=Array(6).fill(0);answers.forEach((a,i)=>scores[key[i][a]]++);const sorted=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);const win=sorted[0].i,second=sorted.find(x=>x.i!==win).i,r=results[win];app.innerHTML='<div class="result"><div class="eyebrow">YOUR RELATIONSHIP PATTERN</div><div class="emoji">'+r.emoji+'</div><p class="muted">你的高频卡点</p><h2>'+r.title+'</h2><p>'+r.subtitle+'</p><p>'+r.desc+'</p><div class="tagline">不是给你贴标签，而是找出可以改变的一步</div></div><div class="result-copy"><strong>① 什么最容易触发你？</strong><p>'+r.trigger+'</p><div class="item"><strong>② 你可能会自动做什么？</strong><p>'+r.auto+'</p></div><div class="item"><strong>③ 这个反应可能带来什么代价？</strong><p>'+r.impact+'</p></div></div><div class="result-copy"><strong>④ 更有效的替代做法</strong><p>'+r.try+'</p></div><div class="result-copy"><strong>⑤ 你可以直接说出口的话</strong><p>“'+r.say+'”</p></div><div class="result-copy"><strong>⑥ 给自己一个 7 天小实验</strong><p>'+r.experiment+'</p></div><div class="result-copy"><strong>这次结果最想提醒你</strong><p>'+r.remind+'</p></div><div class="result-copy"><strong>你的次要倾向</strong><p>'+results[second].title+'：'+results[second].subtitle+'。你可能在不同关系、不同阶段呈现不同反应；这份结果是自我观察的起点，不是固定的人格判定。</p></div><div class="result-copy"><strong>如果你想继续深入</strong><p>完整的关系复盘报告可以进一步围绕你的具体作答，整理：最容易触发你的情境、你习惯采用的保护策略、它如何影响沟通、你真正想获得的回应，以及适合你练习的对话方案。</p><p class="muted">当前页面展示的是基础结果预览，尚未接入付费解锁。后续若上线付费版，应提供基于答题差异的完整个人报告，而不是重复这段内容。</p></div><button class="primary" onclick="copyResult('+win+')">复制我的关系复盘建议</button><button class="secondary" style="width:100%;margin-top:10px" onclick="start()">重新测试 ↻</button><p class="foot">这是一份恋爱相处模式的趣味自我探索，不是心理诊断，也不代表关系的唯一结论。若关系中存在持续的控制、威胁或伤害，请优先考虑自身安全并寻求可信任的支持。</p>';window.scrollTo({top:0,behavior:"smooth"});}
function copyResult(i){const r=results[i],text='我在亲密关系里最容易卡在：'+r.title+'\n'+r.subtitle+'\n'+r.try+'\n你也来看看自己容易在哪一步卡住。';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert('结果文案已复制！')).catch(()=>fallback(text));}else fallback(text);}
function fallback(text){const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');alert('结果文案已复制！')}catch(e){alert(text)}el.remove();}
