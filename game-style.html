<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1ea">
<title>你是哪种游戏风格原型？</title>
<style>
:root{--ink:#292b2b;--muted:#77776f;--paper:#f5f1ea;--card:#fffdf9;--green:#647b69;--line:#e9e3d9;--soft:#eef1eb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 14px}
main{max-width:620px;margin:0 auto}.card{background:var(--card);border:1px solid rgba(80,70,50,.06);border-radius:26px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 36px #3e35200a}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green);font-weight:700}.muted{color:var(--muted);font-size:14px}h1{font-size:clamp(29px,7vw,40px);line-height:1.2;letter-spacing:-.04em;margin:14px 0}h2{font-size:23px;line-height:1.4;margin:18px 0}p{margin:10px 0}
button{font:inherit;cursor:pointer}.primary,.secondary{border-radius:15px;padding:13px 16px;font-weight:650}.primary{display:block;width:100%;border:0;background:var(--green);color:white;margin-top:22px}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin:10px 0;color:var(--ink);line-height:1.45;min-height:52px}.option.selected{border-color:var(--green);background:var(--soft)}.letter{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:9px;background:#f1eee7;color:var(--green);font-size:12px;font-weight:700}.option.selected .letter{background:var(--green);color:white}.progress{height:5px;background:#e9e3d9;border-radius:9px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;background:var(--green);transition:width .2s}.topline{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.nav{display:flex;gap:10px;margin-top:18px}.nav button{width:100%}.result{text-align:center;padding:12px 0 20px}.emoji{font-size:58px;line-height:1.4}.result-copy{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.result-copy strong{font-size:16px}.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:12px 0}.tag{border-radius:99px;background:var(--soft);padding:5px 10px;font-size:13px;color:#4e6553}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head><body><main><div class="card" id="app"><div class="eyebrow">LITTLE TEST STUDIO · PLAYER ARCHETYPE</div><h1>你是哪种游戏风格原型？</h1><p>收藏家、杀手、吟游诗人……你玩游戏时真正追求的是什么？15 道题，找到你的玩家动机原型。</p><p class="muted">凭第一直觉选择，没有标准答案。</p><button class="primary" onclick="start()">开始测试 →</button></div></main>
<script>
const types=[
{name:"收藏家",emoji:"🗝️",desc:"你会被值得留存的东西吸引：稀有物品、故事、知识与隐藏内容。收集不只是占有，而是把世界一点点拼成自己的地图。",tags:["积累","发现","完整感"],advice:"享受收集带来的满足感，也别让清单变成负担。有些体验不必集齐，留下最喜欢的部分就很好。"},
{name:"杀手",emoji:"🗡️",desc:"你喜欢清晰目标、精准执行，以及关键时刻一击命中的感觉。你享受判断局势、找准时机，用技巧和效率解决问题。",tags:["目标感","技巧","掌控"],advice:"挑战能让你保持投入，但不必把每一局都玩成考核。偶尔不追求最优解，也能发现游戏的乐趣。"},
{name:"吟游诗人",emoji:"🎻",desc:"你在意体验里的情绪、故事和人与人之间的连接。一个世界是否让你记得住，不只看难度，更看它有没有留下值得讲述的片段。",tags:["叙事","氛围","共鸣"],advice:"跟着兴趣走是你的优势。遇到不合胃口的剧情，也不必为了完整度勉强自己；你有权选择自己的体验。"},
{name:"建筑师",emoji:"🏛️",desc:"你喜欢把零散的东西组织成自己的系统。规划路线、搭建基地、优化流程，都让你享受从混乱中建立秩序。",tags:["规划","建造","优化"],advice:"计划能帮你把想法落地，但也给意外留点空间。有时临时起意的路线，反而会成为最有趣的回忆。"},
{name:"探索者",emoji:"🧭",desc:"未知本身就足够吸引你。你愿意绕路、试错、打开地图上不起眼的角落，因为发现过程常常比最快抵达终点更有趣。",tags:["好奇","自由","发现"],advice:"好奇心会带你看见更多。别急着把所有问号都变成任务清单，偶尔漫无目的地走走，也算一次发现。"},
{name:"挑战者",emoji:"⚔️",desc:"你喜欢有难度、能检验实力的目标。失败会让你想弄清差距，再来一次。真正的满足感来自突破，而不是轻松获胜。",tags:["成长","技巧","突破"],advice:"复盘和练习会让你进步，也记得给自己留出玩耍的余地。不是每件事都需要赢，能享受过程同样重要。"},
{name:"社交家",emoji:"🍻",desc:"你享受和别人共同创造体验。一起完成任务、互相帮忙、分享笑点与回忆，会让一段游戏经历变得更有价值。",tags:["合作","关系","共享"],advice:"你很会让体验变得热闹，但也可以放心独自玩一会儿。不需要每次上线都负责让所有人开心。"},
{name:"导演",emoji:"🎭",desc:"你喜欢影响局势、组织资源、设计策略。比起只完成眼前任务，你更享受看见全局、安排节奏，让各个部分配合起来。",tags:["统筹","布局","决策"],advice:"你擅长让事情运转起来，但不必总做那个安排一切的人。有时把选择交给队友，也会有新的惊喜。"}
];
const qs=[
["打开一款新游戏，你最先想做什么？",["把地图和可收集内容摸清楚","找一个高难度目标试试手","看看故事设定和角色关系","研究系统，规划成长路线"]],
["完成主线任务后，你通常会？",["回头清理遗漏物品和隐藏内容","挑战更难的关卡或成就","找朋友一起玩点别的","研究建造、配装或优化玩法"]],
["哪种奖励最让你满足？",["稀有、独特、值得展示的收藏","证明技术和实力的成就","一段打动人的剧情或角色结局","发现新区域或隐藏内容"]],
["多人游戏里，你自然会？",["记下资源位置和队伍需要什么","承担关键战斗、处理高威胁目标","带动聊天，让大家玩得开心","安排分工，协调团队行动"]],
["面对一张很大的地图，你更想？",["寻找隐藏物和可收集品","去挑战最危险的区域","沿故事线认识这个世界","自由探索没标记的角落"]],
["你最享受哪种进步？",["收藏越来越完整","操作更精准，挑战越来越轻松","更理解角色和故事","基地或系统越来越完善"]],
["遇到卡关时，你通常？",["搜集更多线索和资源","反复练习直到突破","和别人讨论不同思路","换策略、调整配置或重新规划"]],
["哪种内容最容易让你沉迷？",["隐藏任务、稀有掉落、完整图鉴","高难度战斗、排名和极限挑战","剧情分支、角色互动和世界观","建造系统、经营管理和资源循环"]],
["你更喜欢怎样的游戏节奏？",["慢慢探索积累，不怕花时间","节奏紧凑，目标和反馈明确","跟着情绪和故事自然推进","先规划再行动，节奏由自己掌控"]],
["你最想让队友怎么评价你？",["总能找到需要的东西","关键时刻靠得住，操作很稳","和你一起玩特别有意思","有你在，大家做事很有章法"]],
["如果可以自由选择路线，你会？",["体验所有支线和隐藏内容","选最能检验能力的路线","选最有故事感的路线","选能建立长期优势的路线"]],
["你会因为什么记住一款游戏？",["那些花时间找到的稀有东西","一次特别艰难的胜利","一个久久忘不掉的故事","亲手建成的世界和系统"]],
["面对重复刷取，你的想法更接近？",["能补齐收藏就有意义","能提升效率或实力就值得","和朋友一起就不无聊","能规划出稳定循环就愿意做"]],
["限时活动出现，你会？",["先看限定奖励和错过成本","优先挑战最难的任务","拉朋友一起参加","规划时间和资源，最大化收益"]],
["哪句话最像你的游戏哲学？",["世界很大，值得一件件发现","想赢，就把关键动作练到极致","故事和伙伴才让冒险有意义","把系统玩明白，就能创造自己的规则"]]
];
// 每道题的四个选项分别对应四种动机，轮换映射避免同一字母总对应同一结果。
const map=[[0,5,2,3],[0,5,6,3],[0,5,2,4],[3,5,6,7],[0,5,2,4],[0,5,2,3],[0,5,6,7],[0,5,2,3],[0,5,2,7],[0,5,6,7],[0,5,2,3],[0,5,2,3],[0,5,6,7],[0,5,6,7],[0,5,2,7]];
let index=0,answers=[];
const app=document.getElementById("app");
function home(){index=0;answers=[];app.innerHTML='<div class="eyebrow">LITTLE TEST STUDIO · PLAYER ARCHETYPE</div><h1>你是哪种游戏风格原型？</h1><p>收藏家、杀手、吟游诗人……你玩游戏时真正追求的是什么？15 道题，找到你的玩家动机原型。</p><p class="muted">凭第一直觉选择，没有标准答案。</p><button class="primary" onclick="start()">开始测试 →</button>';}
function start(){index=0;answers=[];app.replaceChildren();renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){const q=qs[index];const percent=Math.round(index/qs.length*100);app.innerHTML='<div class="topline"><span class="muted">玩家风格探索</span><span class="muted">第 '+(index+1)+' / '+qs.length+' 题</span></div><div class="progress"><div class="bar" style="width:'+percent+'%"></div></div><h2>'+q[0]+'</h2><div>'+q[1].map((x,j)=>'<button class="option'+(answers[index]===j?' selected':'')+'" onclick="pick('+j+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+x+'</span></button>').join('')+'</div><div class="nav">'+(index?'<button class="secondary" onclick="back()">← 上一题</button>':'<button class="secondary" onclick="home()">返回介绍</button>')+'</div>';}
function back(){if(index>0){index--;renderQuestion();}}
function pick(n){answers[index]=n;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(index<qs.length-1){index++;renderQuestion();}else finish();}
function finish(){const scores=Array(types.length).fill(0);answers.forEach((answer,qi)=>{scores[map[qi][answer]]++;});const max=Math.max(...scores);let winner=scores.indexOf(max);if(scores.filter(v=>v===max).length>1){for(let k=0;k<answers.length;k++){const t=map[k][answers[k]];if(scores[t]===max){winner=t;break;}}}const t=types[winner];const second=scores.map((v,i)=>({v,i})).filter(x=>x.i!==winner).sort((a,b)=>b.v-a.v)[0];app.innerHTML='<div class="result"><div class="eyebrow">YOUR PLAYER ARCHETYPE</div><div class="emoji">'+t.emoji+'</div><p class="muted">你的玩家原型是</p><h2>'+t.name+'</h2><p>'+t.desc+'</p><div class="tags">'+t.tags.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div></div><div class="result-copy"><strong>你为什么像这种玩家</strong><p>'+t.advice+'</p><p class="muted">你的第二倾向：'+types[second.i].name+' '+types[second.i].emoji+'</p></div><div class="result-copy"><strong>适合你的游戏体验</strong><p>'+experience(winner)+'</p></div><div class="nav"><button class="primary" onclick="copyResult('+winner+')">复制我的结果</button><button class="secondary" onclick="start()">再玩一次 ↻</button></div><p class="foot">这是一个帮助你发现自己游戏偏好的趣味小测试。</p>';window.scrollTo({top:0,behavior:"smooth"});}
function experience(i){return ["有探索与收集内容、图鉴、隐藏支线的游戏，会让你很有持续推进的动力。","有明确目标、操作空间和难度梯度的游戏，更容易让你进入专注状态。","角色塑造鲜明、世界观完整、能留下情绪记忆的游戏，更容易打动你。","能规划、建造、经营并逐步优化系统的游戏，会让你越玩越投入。","地图开放、路线自由、鼓励试错和意外发现的游戏，最适合你的好奇心。","有挑战、有反馈、能通过练习看到进步的游戏，会让你更有成就感。","合作任务、多人互动和能创造共同回忆的游戏，会让体验更有意思。","策略选择、资源管理、团队调度和长期布局，会让你感到自己真正影响着局势。"][i];}
function copyResult(i){const t=types[i];const text='我的玩家原型是 '+t.emoji+t.name+'！'+t.desc+'\n你是哪种游戏风格？';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert("结果文案已复制，可以去分享啦！")).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const el=document.createElement("textarea");el.value=text;document.body.appendChild(el);el.select();try{document.execCommand("copy");alert("结果文案已复制，可以去分享啦！");}catch(e){alert(text);}el.remove();}
</script></body></html>
