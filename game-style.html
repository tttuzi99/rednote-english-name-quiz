<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你是哪种游戏风格原型？</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f1ec;color:#292b2b;max-width:650px;margin:25px auto;padding:16px}.box{background:#fffdf9;border-radius:24px;padding:24px}button{font:inherit;border:0;border-radius:12px;padding:12px;background:#788875;color:white;width:100%;cursor:pointer}p{line-height:1.7}.muted{color:#777}</style><div class="box"><p class="muted">LITTLE TEST STUDIO · PLAYER ARCHETYPE</p><h1>你是哪种游戏风格原型？</h1><p>收藏家、杀手、吟游诗人……你玩游戏时真正追求的是什么？15 道题，找到你的玩家动机原型。</p><button onclick="start()">开始测试 →</button><div id="app"></div></div><script>
const types=[["收藏家","🗝️","你会被值得留存的东西吸引：稀有物品、故事、知识与隐藏内容。收集不是单纯占有，而是把世界一点点拼成自己的地图。关键词：积累、发现、完整感。"],["杀手","🗡️","你喜欢清晰目标、精准执行，以及关键时刻一击命中的感觉。你享受判断局势、找准时机，用技巧和效率解决问题。关键词：目标、技巧、掌控。"],["吟游诗人","🎻","你在意体验里的情绪、故事和人与人之间的连接。一个世界是否让你记得住，不只看难度，更看它有没有留下值得讲述的片段。关键词：叙事、氛围、共鸣。"],["建筑师","🏛️","你喜欢把零散的东西组织成自己的系统。规划路线、搭建基地、优化流程，都让你享受从混乱中建立秩序。关键词：规划、建造、优化。"],["探索者","🧭","未知本身就足够吸引你。你愿意绕路、试错、打开地图上不起眼的角落，因为发现过程常常比最快抵达终点更有趣。关键词：好奇、自由、发现。"],["挑战者","⚔️","你喜欢有难度、能检验实力的目标。失败会让你想弄清差距，再来一次。真正的满足感来自突破，而不是轻松获胜。关键词：成长、技巧、极限。"],["社交家","🍻","你享受和别人共同创造体验。一起完成任务、互相帮忙、分享笑点与回忆，会让一段游戏经历变得更有价值。关键词：合作、关系、共享。"],["导演","🎭","你喜欢影响局势、组织资源、设计策略。比起只完成眼前任务，你更享受看见全局、安排节奏，让各个部分配合起来。关键词：统筹、布局、决策。"]];
const qs=[["打开一款新游戏，你最先想做什么？",["把地图和可收集内容摸清楚","找一个高难度目标试试手","看看故事设定和角色关系","研究系统，规划成长路线"]],["完成主线任务后，你通常会？",["回头清理遗漏物品和隐藏内容","挑战更难的关卡或成就","找朋友一起玩点别的","研究建造、配装或优化玩法"]],["哪种奖励最让你满足？",["稀有、独特、值得展示的收藏","证明技术和实力的成就","一段打动人的剧情或角色结局","发现新区域或隐藏内容"]],["多人游戏里，你自然会？",["记下资源位置和队伍需要什么","承担关键战斗、处理高威胁目标","带动聊天，让大家玩得开心","安排分工，协调团队行动"]],["面对一张很大的地图，你更想？",["寻找隐藏物和可收集品","去挑战最危险的区域","沿故事线认识这个世界","自由探索没标记的角落"]],["你最享受哪种进步？",["收藏越来越完整","操作更精准，挑战越来越轻松","更理解角色和故事","基地或系统越来越完善"]],["遇到卡关时，你通常？",["搜集更多线索和资源","反复练习直到突破","和别人讨论不同思路","换策略、调整配置或重新规划"]],["哪种内容最容易让你沉迷？",["隐藏任务、稀有掉落、完整图鉴","高难度战斗、排名和极限挑战","剧情分支、角色互动和世界观","建造系统、经营管理和资源循环"]],["你更喜欢怎样的游戏节奏？",["慢慢探索积累，不怕花时间","节奏紧凑，目标和反馈明确","跟着情绪和故事自然推进","先规划再行动，节奏由自己掌控"]],["你最想让队友怎么评价你？",["总能找到需要的东西","关键时刻靠得住，操作很稳","和你一起玩特别有意思","有你在，大家做事很有章法"]],["如果可以自由选择路线，你会？",["体验所有支线和隐藏内容","选最能检验能力的路线","选最有故事感的路线","选能建立长期优势的路线"]],["你会因为什么记住一款游戏？",["那些花时间找到的稀有东西","一次特别艰难的胜利","一个久久忘不掉的故事","亲手建成的世界和系统"]],["面对重复刷取，你的想法更接近？",["能补齐收藏就有意义","能提升效率或实力就值得","和朋友一起就不无聊","能规划出稳定循环就愿意做"]],["限时活动出现，你会？",["先看限定奖励和错过成本","优先挑战最难的任务","拉朋友一起参加","规划时间和资源，最大化收益"]],["哪句话最像你的游戏哲学？",["世界很大，值得一件件发现","想赢，就把关键动作练到极致","故事和伙伴才让冒险有意义","把系统玩明白，就能创造自己的规则"]]];
let i=0,a=[];function start(){i=0;a=[];render()}function render(){let q=qs[i],d=document.getElementById('app');d.innerHTML='<p class="muted">第 '+(i+1)+' / 15 题</p><h2>'+q[0]+'</h2>'+q[1].map((x,j)=>'<p><button onclick="pick('+j+')">'+String.fromCharCode(65+j)+' · '+x+'</button></p>').join('')+(i?'<button onclick="back()">← 上一题</button>':'')}function back(){i--;render()}function pick(n){a[i]=n;if(i<14){i++;render()}else finish()}function finish(){let s=Array(8).fill(0);a.forEach((v,j)=>s[(v+j*3)%8]++);let t=types[s.indexOf(Math.max(...s))];document.getElementById('app').innerHTML='<h2>'+t[1]+' 你是：'+t[0]+'</h2><p>'+t[2]+'</p><p class="muted">这是一份原创趣味测试，参考玩家动机分类思路，不是 Quantic Foundry 官方测试。</p><button onclick="start()">重新测试</button>'}
</script></html>
