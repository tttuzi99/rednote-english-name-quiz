</head><body><main><div class="card" id="app"><div class="eyebrow">LITTLE TEST STUDIO · PLAYER ARCHETYPE</div><h1>你是哪种游戏风格原型？</h1><p>收藏家、杀手、吟游诗人……你玩游戏时真正追求的是什么？15 道题，找到你的玩家动机原型。</p><p class="muted">凭第一直觉选择，没有标准答案。</p><button class="primary" onclick="start()">开始测试 →</button></div></main>

function home(){index=0;answers=[];app.innerHTML='<div class="eyebrow">LITTLE TEST STUDIO · PLAYER ARCHETYPE</div><h1>你是哪种游戏风格原型？</h1><p>收藏家、杀手、吟游诗人……你玩游戏时真正追求的是什么？15 道题，找到你的玩家动机原型。</p><p class="muted">凭第一直觉选择，没有标准答案。</p><button class="primary" onclick="start()">开始测试 →</button>';}
function start(){index=0;answers=[];app.replaceChildren();renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){const q=qs[index];const percent=Math.round(index/qs.length*100);app.innerHTML='<div class="topline"><span class="muted">玩家风格探索</span><span class="muted">第 '+(index+1)+' / '+qs.length+' 题</span></div><div class="progress"><div class="bar" style="width:'+percent+'%"></div></div><h2>'+q[0]+'</h2><div>'+q[1].map((x,j)=>'<button class="option'+(answers[index]===j?' selected':'')+'" onclick="pick('+j+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+x+'</span></button>').join('')+'</div><div class="nav">'+(index?'<button class="secondary" onclick="back()">← 上一题</button>':'<button class="secondary" onclick="home()">返回介绍</button>')+'</div>';}
function back(){if(index>0){index--;renderQuestion();}}
function pick(n){answers[index]=n;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(index<qs.length-1){index++;renderQuestion();}else finish();}

[{name:"模拟人生 4",why:"从生活安排到空间布置，都能按自己的想法规划"},{name:"城市：天际线",why:"建设城市、管理资源，再一点点优化运转"},{name:"我的世界",why:"从零搭建自己的世界，规划与创造空间很大"},{name:"文明 VI",why:"统筹科技、城市和外交，享受长期布局的成就感"}],
[{name:"塞尔达传说：王国之泪",why:"解法不止一种，探索和临场发挥都很自由"},{name:"原神",why:"地图探索、解谜和意外发现能持续带来新鲜感"},{name:"无人深空",why:"在广阔宇宙里探索星球、发现生物与地点"},{name:"艾尔登法环",why:"不按固定路线走，也常能发现隐藏区域和惊喜"}],
[{name:"艾尔登法环",why:"在试错与研究中突破强敌，成就感来得扎实"},{name:"只狼：影逝二度",why:"精准格挡和节奏判断会随着练习越来越熟"},{name:"怪物猎人：崛起",why:"熟悉武器、研究招式，挑战强敌的过程很过瘾"},{name:"蔚蓝",why:"关卡短而精，适合用一次次尝试突破自己"}],

{headline:"你会把游戏玩成一张逐渐完整的收藏地图。",moment:"发现一个不起眼的角落藏着稀有物品，或终于补齐最后一格图鉴。",pitfall:"容易为了完成度把兴趣变成待办清单；如果开始疲惫，可以只收集真正喜欢的东西。"},

function renderRecommendations(i){return '<div class="result-copy"><strong>猜你喜欢 · 这几款可能合你胃口</strong><p class="muted">按你的玩家偏好挑选，不代表只能玩这一类。</p>'+gameRecs[i].map((g,n)=>'<div style="padding:10px 0;border-top:1px solid var(--line);text-align:left"><strong>'+g.name+'</strong><p class="muted" style="margin:3px 0 0">'+g.why+'</p></div>').join('')+'</div>';}
function renderPlayerInsight(i){const d=playerDetails[i];return '<div class="result-copy" style="text-align:left"><strong>你的游戏习惯</strong><p>'+d.headline+'</p><p><strong>你最享受的瞬间：</strong>'+d.moment+'</p><p><strong>可能踩的坑：</strong>'+d.pitfall+'</p></div>';}
function finish(){const scores=Array(types.length).fill(0);answers.forEach((answer,qi)=>{scores[map[qi][answer]]++;});const max=Math.max(...scores);let winner=scores.indexOf(max);if(scores.filter(v=>v===max).length>1){for(let k=0;k<answers.length;k++){const t=map[k][answers[k]];if(scores[t]===max){winner=t;break;}}}const t=types[winner];const second=scores.map((v,i)=>({v,i})).filter(x=>x.i!==winner).sort((a,b)=>b.v-a.v)[0];app.innerHTML='<div class="result"><div class="eyebrow">YOUR PLAYER ARCHETYPE</div><div class="emoji">'+t.emoji+'</div><p class="muted">你的玩家原型是</p><h2>'+t.name+'</h2><p>'+t.desc+'</p><div class="tags">'+t.tags.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div></div><div class="result-copy"><strong>你为什么像这种玩家</strong><p>'+t.advice+'</p><p class="muted">你的第二倾向：'+types[second.i].name+' '+types[second.i].emoji+'（也可以留意这个方向的推荐）</p></div>'+renderPlayerInsight(winner)+'<div class="result-copy"><strong>适合你的游戏体验</strong><p>'+experience(winner)+'</p></div>'+renderRecommendations(winner)+'<div class="nav"><button class="primary" onclick="copyResult('+winner+')">复制我的结果</button><button class="secondary" onclick="start()">再玩一次 ↻</button></div><p class="foot">这是一个帮助你发现自己游戏偏好的趣味小测试。</p>';window.scrollTo({top:0,behavior:"smooth"});}
function experience(i){return ["有探索与收集内容、图鉴、隐藏支线的游戏，会让你很有持续推进的动力。","有明确目标、操作空间和难度梯度的游戏，更容易让你进入专注状态。","角色塑造鲜明、世界观完整、能留下情绪记忆的游戏，更容易打动你。","能规划、建造、经营并逐步优化系统的游戏，会让你越玩越投入。","地图开放、路线自由、鼓励试错和意外发现的游戏，最适合你的好奇心。","有挑战、有反馈、能通过练习看到进步的游戏，会让你更有成就感。","合作任务、多人互动和能创造共同回忆的游戏，会让体验更有意思。","策略选择、资源管理、团队调度和长期布局，会让你感到自己真正影响着局势。"][i];}
function copyResult(i){const t=types[i];const text='我的玩家原型是 '+t.emoji+t.name+'！'+t.desc+'\n你是哪种游戏风格？';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert("结果文案已复制，可以去分享啦！")).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const el=document.createElement("textarea");el.value=text;document.body.appendChild(el);el.select();try{document.execCommand("copy");alert("结果文案已复制，可以去分享啦！");}catch(e){alert(text);}el.remove();}
</script></body></html>
